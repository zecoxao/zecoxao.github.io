<!DOCTYPE html>
<html lang="en" manifest="offline.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<link rel="preload" href="slopkit/cat.jpg" as="image">
<link rel="preload" href="slopkit/mmhmm-cats-ps5.gif" as="image">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 28%, #18233a 0, #0c111b 44%, #07090e 100%);
    color: #c8ced8;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap {
    height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
  }
  #cat {
    box-sizing: border-box; width: 150px; height: 150px; object-fit: cover;
    max-width: 34vw; max-height: 34vw;
    border: 4px solid #343c49; border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }

  #actions {
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
  }
  .action {
    box-sizing: border-box; display: inline-block; min-width: 185px;
    padding: 17px 30px; border: 1px solid rgba(255,255,255,.22);
    border-radius: 15px; color: #fff;
    background: linear-gradient(135deg, #3b8cff, #1957c8);
    box-shadow: 0 12px 30px rgba(18,79,190,.32), inset 0 1px rgba(255,255,255,.22);
    font: 700 20px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .025em; text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }

  .action:focus {
    outline: none; transform: translateY(-3px);
    border-color: #fff; box-shadow: 0 0 0 4px rgba(91,158,255,.3), 0 16px 36px rgba(18,79,190,.45);
  }
  .action:active { transform: translateY(1px); }
  .action.secondary {
    color: #eaf2ff; background: linear-gradient(135deg, #273850, #172235);
    box-shadow: 0 12px 30px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.12);
  }
  .action.secondary:focus { box-shadow: 0 0 0 4px rgba(91,158,255,.25), 0 16px 36px rgba(0,0,0,.38); }
  .action.done {
    color: #effff4; background: linear-gradient(135deg, #239d52, #126531);
    border-color: rgba(123,255,162,.55); box-shadow: 0 12px 30px rgba(24,142,67,.26);
    pointer-events: none;
  }
  #status { min-height: 1.5em; color: #9fb1c3; font-size: 18px; }

  #cache {
    box-sizing: border-box; width: 420px; max-width: 88vw;
    min-height: 34px; color: #8b9aad; font-size: 15px; letter-spacing: .02em;
  }
  #cache .cacheHead {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px; margin-bottom: 6px;
  }
  #cache .cachePct { font-weight: 700; color: #c8d4e4; font-variant-numeric: tabular-nums; }
  #cache .cacheTrack {
    height: 6px; border-radius: 3px; overflow: hidden;
    background: rgba(255,255,255,.08);
  }
  #cache .cacheFill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #3b8cff, #5bb0ff);
    transition: width .2s ease;
  }
  /* Diagnostics. Deliberately readable from a phone photo of the TV -- it is
     the only debug channel a console browser has. */
  #cache .cacheInfo {
    margin-top: 6px; font-size: 14px; line-height: 1.35; color: #8794a6;
    letter-spacing: .03em; word-break: break-word;
    font-family: "Consolas", "DejaVu Sans Mono", monospace;
  }
  #cache.done .cachePct, #cache.done .cacheLabel { color: #8fe0ab; }
  #cache.done .cacheFill { background: linear-gradient(90deg, #239d52, #47c76a); }
  #cache.fail .cachePct, #cache.fail .cacheLabel { color: #ffb3ba; }
  #cache.fail .cacheFill { background: linear-gradient(90deg, #a33, #d9534f); }

  @media (max-width: 650px) {
    #actions { width: 82vw; }
    .action { width: 100%; }
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="cat" src="slopkit/cat.jpg" alt="">
  <div id="actions">
    <a id="start" class="action"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"
       tabindex="0">RUN</a>
  </div>
  <div id="status"></div>
  <div id="cache"></div>
</div>

<script>try {
    var q = new URLSearchParams(location.search);
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("cat").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}
</script>

<script src="slopkit-cache.js"></script>
<script src="cache-ui.js"></script>

</body>
</html>
